const RANKS = [
  { name: 'Script Newbie', min: 0 }, { name: 'Packet Sniffer', min: 200 }, { name: 'Port Prober', min: 500 },
  { name: 'Shell Popper', min: 850 }, { name: 'Root Hunter', min: 1150 }, { name: 'Zero-Day Sage', min: 1450 }
];
const KEY = 'shellcamp-progress-v1';
let state = { solved: {}, points: 0, streak: 0, lastDay: null };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.solved) state = s; } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

const allQuestions = id => ROOMS[id].tasks.flatMap(t => t.questions);
const roomProgress = id => { const qs = allQuestions(id); return { done: qs.filter(q => state.solved[q.id]).length, total: qs.length }; };
const roomDone = id => { const p = roomProgress(id); return p.done === p.total; };
const rankFor = pts => RANKS.filter(r => pts >= r.min).pop();
const today = () => new Date().toISOString().slice(0, 10);

function bumpStreak() {
  const t = today();
  if (state.lastDay === t) return;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  state.streak = state.lastDay === y ? state.streak + 1 : 1;
  state.lastDay = t;
}

function renderStats() {
  document.getElementById('s-points').textContent = state.points;
  let streak = state.streak;
  const y = new Date(Date.now() - 864e5).toISOString().slice(0, 10);
  if (state.lastDay !== today() && state.lastDay !== y) streak = 0;
  document.getElementById('s-streak').textContent = streak;
  document.getElementById('s-rooms').textContent = Object.keys(ROOMS).filter(roomDone).length;
  document.getElementById('s-rank').textContent = rankFor(state.points).name;
  const L = levelInfo(state.points);
  document.getElementById('s-level').textContent = L.level;
  document.getElementById('s-level2').textContent = L.level;
  document.getElementById('s-xptext').textContent = L.isMax ? 'Max level' : `${L.into} / ${L.need} XP`;
  document.getElementById('s-xpbar').style.width = (L.isMax ? 100 : (L.into / L.need) * 100) + '%';
}

/* ---------- Levels: 1 XP per point, a new level every XP_PER_LEVEL ---------- */
const XP_PER_LEVEL = 80;
const TOTAL_POINTS = Object.keys(ROOMS).reduce((n, id) => n + allQuestions(id).reduce((m, q) => m + q.pts, 0), 0);
const MAX_LEVEL = Math.floor(TOTAL_POINTS / XP_PER_LEVEL) + 1;
function levelInfo(pts) {
  const level = Math.min(Math.floor(pts / XP_PER_LEVEL) + 1, MAX_LEVEL);
  const isMax = level === MAX_LEVEL;
  const into = pts - (level - 1) * XP_PER_LEVEL;
  return { level, isMax, into, need: XP_PER_LEVEL, toNext: isMax ? 0 : XP_PER_LEVEL - into };
}

/* Overall course numbers used by the progress page */
function courseStats() {
  const qs = Object.keys(ROOMS).flatMap(allQuestions);
  const doneQs = qs.filter(q => state.solved[q.id]);
  const flags = qs.filter(q => q.flag), doneFlags = flags.filter(q => state.solved[q.id]);
  const roomsDone = ORDER.filter(roomDone).length;
  const minsLeft = ORDER.reduce((n, id) => { const p = roomProgress(id); return n + ROOMS[id].mins * (1 - p.done / p.total); }, 0);
  return { qs: qs.length, doneQs: doneQs.length, flags: flags.length, doneFlags: doneFlags.length, rooms: ORDER.length, roomsDone, minsLeft: Math.round(minsLeft), pct: Math.round((doneQs.length / qs.length) * 100) };
}
const fmtMins = m => m <= 0 ? 'none' : m < 60 ? `${m} min` : `${Math.floor(m / 60)} h ${m % 60} min`;

let toastTimer;
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200);
}

const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

}

function pathBlock(p) {
  const qs = p.rooms.flatMap(allQuestions), done = qs.filter(q => state.solved[q.id]).length;

    <div class="rooms">${p.rooms.map(roomCard).join('')}</div></section>`;
}

function nextRoom() {
  for (const p of PATHS) for (const id of p.rooms) if (!roomDone(id)) return id;

  <div class="gloss" id="glist"></div>

  const list = document.getElementById('glist'), s = document.getElementById('gsearch'), none = document.getElementById('gnone');
  const draw = () => {
    const q = s.value.trim().toLowerCase();
    const items = GLOSSARY.filter(([t, d]) => !q || t.toLowerCase().includes(q) || d.toLowerCase().includes(q));
    list.innerHTML = items.map(([t, d]) => `<div class="gloss-item"><b>${esc(t)}</b><span>${esc(d)}</span></div>`).join('');

function taskHTML(t, i, open, roomId) {
  const complete = t.questions.every(q => state.solved[q.id]);
  const deep = DETAIL[roomId] && DETAIL[roomId][i];
  return `<details class="task${complete ? ' complete' : ''}"${open ? ' open' : ''}>
    <summary><span class="task-num">${complete ? '✓' : ''} Task ${i + 1}</span><h3>${esc(t.title)}</h3><span class="chev">›</span></summary>
    <div class="task-body"><div class="lesson">${t.body}${deep ? `<div class="deep"><div class="eyebrow">In more detail</div>${deep}</div>` : ''}</div>
    <div class="questions">${t.questions.map(q => {
      const s = state.solved[q.id];
      return `<div class="q${s ? ' solved' : ''}" id="q-${q.id}"><label for="in-${q.id}">${esc(q.q)}</label>
      <div class="q-row"><input id="in-${q.id}" autocomplete="off" spellcheck="false" placeholder="${q.flag ? 'SC{...}' : 'Answer'}" ${s ? `value="${esc(q.a[0])}" disabled` : ''}>
      <button class="btn small" id="b-${q.id}" ${s ? 'disabled' : ''}>${s ? '✓ Correct' : 'Submit'}</button></div>
      <div class="q-foot"><span class="pts">${q.pts} pts</span>${s ? '' : `<button class="linkbtn" id="h-${q.id}">Show hint</button>`}</div>
      <div class="hint" id="hint-${q.id}" hidden>${esc(q.hint)}</div></div>`;
    }).join('')}</div></div></details>`;
}

const norm = s => s.trim().toLowerCase().replace(/\s+/g, ' ');

function wireQuestion(q, roomId) {
  if (state.solved[q.id]) return;
  const input = document.getElementById('in-' + q.id), btn = document.getElementById('b-' + q.id);
  const hintBtn = document.getElementById('h-' + q.id);
  if (hintBtn) hintBtn.onclick = () => { const h = document.getElementById('hint-' + q.id); h.hidden = !h.hidden; hintBtn.textContent = h.hidden ? 'Show hint' : 'Hide hint'; };
  const check = () => {
    if (!input.value.trim()) return;
    if (q.a.some(a => norm(a) === norm(input.value))) {
      const wasDone = roomDone(roomId);
      const lvlBefore = levelInfo(state.points).level, rankBefore = rankFor(state.points).name;
      state.solved[q.id] = true; state.points += q.pts; bumpStreak(); save(); renderStats();
      const lvlAfter = levelInfo(state.points).level, rankAfter = rankFor(state.points).name;
      if (lvlAfter > lvlBefore) setTimeout(() => toast(rankAfter !== rankBefore ? `Level ${lvlAfter}! New rank: ${rankAfter}` : `Level up! You reached Level ${lvlAfter}`), 2300);
      const box = document.getElementById('q-' + q.id);
      box.classList.add('solved'); input.disabled = true; btn.disabled = true; btn.textContent = '✓ Correct';
      if (hintBtn) hintBtn.remove();
      const p = roomProgress(roomId);
      document.getElementById('room-prog').innerHTML = `${p.done}/${p.total} answered<div class="meter"><i style="width:${(p.done / p.total) * 100}%"></i></div>`;
      const task = box.closest('.task'), taskQs = [...task.querySelectorAll('.q')];
      if (taskQs.every(el => el.classList.contains('solved'))) { task.classList.add('complete'); task.querySelector('.task-num').textContent = '✓ ' + task.querySelector('.task-num').textContent.replace('✓', '').trim(); }
      if (!wasDone && roomDone(roomId)) { toast(`Room complete! +${q.pts} points`); const nb = document.getElementById('next-room'); if (nb) nb.hidden = false; }
      else toast(q.flag ? `Flag captured! +${q.pts} points` : `Correct! +${q.pts} points`);
    } else {
      input.classList.remove('wrong'); void input.offsetWidth; input.classList.add('wrong');
    }
  };
  btn.onclick = check;
  input.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
}

  const out = document.getElementById('out'), inp = document.getElementById('cmd'), term = document.getElementById('term'), promptEl = document.getElementById('prompt');
  const shortPath = p => p === L.home ? '~' : p.startsWith(L.home + '/') ? '~' + p.slice(L.home.length) : p;
  const setPrompt = () => { promptEl.textContent = `${L.user}@${L.host}:${shortPath(cwd)}$`; };
  const print = (html) => { const d = document.createElement('div'); d.innerHTML = html; out.appendChild(d); term.scrollTop = term.scrollHeight; };
  setPrompt();
  print(`<span class="d">Connected to ${L.host} (${L.ip}). Type </span><span class="h">help</span><span class="d"> to list commands.</span>`);
  term.addEventListener('click', e => { if (!window.getSelection().toString()) inp.focus(); });
  lab.querySelectorAll('.cheats button').forEach(b => b.onclick = () => { inp.value = b.dataset.c; inp.focus(); });

  const resolve = p => {
    if (!p || p === '~') return L.home;
    if (p.startsWith('~/')) p = L.home + p.slice(1);
    const parts = (p.startsWith('/') ? p : cwd + '/' + p).split('/');
    const stack = [];
    for (const s of parts) { if (!s || s === '.') continue; if (s === '..') stack.pop(); else stack.push(s); }
    return '/' + stack.join('/');
  };
  const isFile = p => Object.prototype.hasOwnProperty.call(L.files, p);
  const canRead = p => { const md = L.modes && L.modes[p]; if (!md) return true; return md.o === L.user ? md.m[1] === 'r' : md.m[7] === 'r'; };
  const isDir = p => p === '/' || Object.keys(L.files).some(f => f.startsWith(p + '/'));
  const children = p => { const pre = p === '/' ? '/' : p + '/'; const set = new Map();
    Object.keys(L.files).forEach(f => { if (f.startsWith(pre)) { const rest = f.slice(pre.length); const name = rest.split('/')[0]; set.set(name, rest.includes('/')); } });
    return [...set.entries()].sort((a, b) => a[0].localeCompare(b[0])); };
  const tokenize = s => (s.match(/"[^"]*"|'[^']*'|\S+/g) || []).map(t => t.replace(/^(["'])(.*)\1$/, '$2'));

  function run(args, stdin) {
    const [cmd, ...rest] = args;
    const flags = rest.filter(a => /^-/.test(a)), pos = rest.filter(a => !/^-/.test(a));
    const readArg = () => { if (pos.length) { const p = resolve(pos[pos.length - 1]); if (isFile(p) && !canRead(p)) return { err: `${cmd}: ${pos[pos.length - 1]}: Permission denied` }; if (isFile(p)) return { text: L.files[p] }; return { err: `${cmd}: ${pos[pos.length - 1]}: ${isDir(p) ? 'Is a directory' : 'No such file or directory'}` }; } return { text: stdin || '' }; };
    switch (cmd) {
      case 'help': return { text: 'Commands you can use in this lab:\n  whoami  pwd  ls [-a] [dir]  cd <dir>  cat <file>  echo <text>\n  grep [-c] [-i] [-v] <pattern> [file]   wc -l   head [-n N]   tail [-n N]\n  sort   uniq [-c]   hostname   id   clear   history\n' + (kind === 'recon' ? '  ping <ip>   nmap [-sV] <ip>   curl <url>\n' : '') + (L.help ? L.help + '\n' : '') + (L.modes ? '  ls -l   chmod +x <file>   ./<file>\n' : '') + 'Chain commands with a pipe, for example:  grep Failed file | wc -l' };
      case 'whoami': return { text: L.user };
      case 'hostname': return { text: L.host };
      case 'id': return { text: `uid=1000(${L.user}) gid=1000(${L.user}) groups=1000(${L.user})` };
      case 'pwd': return { text: cwd };
      case 'echo': return { text: rest.join(' ') };
      case 'history': return { text: hist.map((h, i) => `  ${String(i + 1).padStart(3)}  ${h}`).join('\n') };
      case 'ls': {
        const target = resolve(pos[0] || cwd);
        if (isFile(target)) return { text: pos[0] };
        if (!isDir(target)) return { err: `ls: cannot access '${pos[0]}': No such file or directory` };
        const all = flags.some(f => f.includes('a'));
        let items = children(target).filter(([n]) => all || !n.startsWith('.'));
        if (flags.some(f => f.includes('l'))) {
          const pre = target === '/' ? '/' : target + '/';
          const lines = items.map(([n, dir]) => {
            const md = dir ? { m: 'drwxr-xr-x', o: L.user, g: L.user } : (L.modes && L.modes[pre + n]) || { m: '-rw-r--r--', o: L.user, g: L.user };
            const size = dir ? 4096 : (L.files[pre + n] || '').length;
            const name = dir ? `<span style="color:var(--term-prompt)">${esc(n)}/</span>` : md.m[3] === 'x' ? `<span style="color:#45C982">${esc(n)}</span>` : esc(n);
            return `${md.m} 1 ${md.o.padEnd(8)} ${md.g.padEnd(8)} ${String(size).padStart(5)} Nov 25 09:00 ${name}`;
          });
          return { html: `total ${items.length * 4}\n` + lines.join('\n') };
        }
        const names = items.map(([n, dir]) => dir ? `<span style="color:var(--term-prompt)">${esc(n)}/</span>` : esc(n));
        if (all) names.unshift('<span style="color:var(--term-prompt)">./</span>', '<span style="color:var(--term-prompt)">../</span>');
        return { html: names.join('  ') };
      }
      case 'cd': {
        const target = resolve(pos[0] || '~');
        if (isFile(target)) return { err: `cd: ${pos[0]}: Not a directory` };
        if (!isDir(target)) return { err: `cd: ${pos[0]}: No such file or directory` };
        cwd = target; setPrompt(); return { text: '' };
      }
      case 'cat': { if (!pos.length && stdin != null) return { text: stdin }; if (!pos.length) return { err: 'cat: missing file name' }; return readArg(); }
      case 'grep': {
        if (!pos.length) return { err: 'usage: grep [-c] [-i] [-v] <pattern> [file]' };
        const pat = pos[0]; const src = pos.length > 1 ? (() => { const p = resolve(pos[1]); return isFile(p) ? { text: L.files[p] } : { err: `grep: ${pos[1]}: No such file or directory` }; })() : { text: stdin || '' };
        if (src.err) return src;
        const ci = flags.some(f => f.includes('i')), inv = flags.some(f => f.includes('v'));
        const lines = src.text.split('\n').filter(Boolean).filter(l => (ci ? l.toLowerCase().includes(pat.toLowerCase()) : l.includes(pat)) !== inv);
        if (flags.some(f => f.includes('c'))) return { text: String(lines.length) };
        return { text: lines.join('\n') };
      }
      case 'wc': { const r = readArg(); if (r.err) return r; const n = r.text.split('\n').filter(Boolean).length; return { text: flags.includes('-l') || !flags.length ? String(n) : String(n) }; }
      case 'head': case 'tail': { const ni = rest.indexOf('-n'); const n = ni >= 0 ? parseInt(rest[ni + 1], 10) || 10 : 10; const fileArgs = pos.filter(p => String(parseInt(p, 10)) !== p); const r = fileArgs.length ? (isFile(resolve(fileArgs[0])) ? { text: L.files[resolve(fileArgs[0])] } : { err: `${cmd}: cannot open '${fileArgs[0]}'` }) : { text: stdin || '' }; if (r.err) return r; const ls = r.text.split('\n').filter(Boolean); return { text: (cmd === 'head' ? ls.slice(0, n) : ls.slice(-n)).join('\n') }; }
      case 'sort': { const r = readArg(); if (r.err) return r; return { text: r.text.split('\n').filter(Boolean).sort().join('\n') }; }
      case 'uniq': { const r = readArg(); if (r.err) return r; const ls = r.text.split('\n').filter(Boolean); const res = []; ls.forEach(l => { const last = res[res.length - 1]; if (last && last.l === l) last.c++; else res.push({ l, c: 1 }); }); return { text: res.map(x => flags.includes('-c') ? `${String(x.c).padStart(7)} ${x.l}` : x.l).join('\n') }; }
      case 'ping': {
        const T = TARGETS[kind];
        if (!T) return { err: 'ping: network is disabled in this lab' };
        if (!pos[0]) return { err: 'usage: ping <ip>' };
        if (pos[0] !== T.ip) return { err: `Out of scope: ${pos[0]} is not your target. This lab only allows ${T.ip}.` };
        return { text: `PING ${T.ip} (${T.ip}) 56(84) bytes of data.\n` + [0.84, 0.79, 0.91, 0.82].map((t, i) => `64 bytes from ${T.ip}: icmp_seq=${i + 1} ttl=64 time=${(20 + t).toFixed(2)} ms`).join('\n') + `\n\n--- ${T.ip} ping statistics ---\n4 packets transmitted, 4 received, 0% packet loss` };
      }
      case 'nmap': {
        const T = TARGETS[kind];
        if (!T) return { err: 'nmap: command not found' };
        if (!pos[0]) return { err: 'usage: nmap [-sV] <ip>' };
        if (pos[0] !== T.ip) return { err: `Out of scope: ${pos[0]} is not your target. Only scan systems you have permission to test.` };
        return { text: flags.some(f => f === '-sV' || f === '-A') ? T.nmap.sv : T.nmap.plain, slow: true };
      }
      case 'curl': {
        const T = TARGETS[kind];
        if (!T) return { err: 'curl: network is disabled in this lab' };
        if (!pos[0]) return { err: 'usage: curl <url>' };
        const m = pos[0].match(/^(?:https?:\/\/)?([^\/]+)(\/.*)?$/);
        if (!m || m[1] !== T.ip) return { err: `Out of scope: only http://${T.ip} is reachable from this lab.` };
        const path = (m[2] || '/').replace(/\/$/, '') || '/';
        return { text: T.web[path] || '<html><body><h1>404 Not Found</h1></body></html>' };
      }
      case 'gobuster': {
        if (kind !== 'dirscan') return { err: 'gobuster: command not found' };
        const ui = rest.indexOf('-u'), url = ui >= 0 ? rest[ui + 1] : '';
        if (rest[0] !== 'dir' || !url) return { err: 'usage: gobuster dir -u <url> -w <wordlist>' };
        if (!/^(https?:\/\/)?10\.10\.30\.2\/?$/.test(url)) return { err: `Out of scope: only http://10.10.30.2 is your target.` };
        return { text: GOBUSTER, slow: true };
      }
      case 'base64': case 'rot13': case 'sha256sum': {
        if (kind !== 'crypto') return { err: `${cmd}: command not found` };
        if (cmd === 'sha256sum') { if (!pos[0]) return { err: 'usage: sha256sum <file>' }; const p = resolve(pos[0]); if (!isFile(p)) return { err: `sha256sum: ${pos[0]}: No such file or directory` }; return { text: `${(L.sha && L.sha[p]) || 'e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855'}  ${pos[0]}` }; }
        const r = readArg(); if (r.err) return r;
        const t = r.text.trim();
        if (cmd === 'rot13') return { text: t.replace(/[a-z]/gi, ch => { const b = ch <= 'Z' ? 65 : 97; return String.fromCharCode((ch.charCodeAt(0) - b + 13) % 26 + b); }) };
        try { return { text: flags.includes('-d') ? atob(t) : btoa(t) }; } catch (e) { return { err: 'base64: invalid input' }; }
      }
      case 'chmod': {
        if (!L.modes) return { err: 'chmod: this lab is read-only' };
        if (pos.length < 2 && !(rest.length >= 2)) return { err: 'usage: chmod +x <file>   or   chmod 755 <file>' };
        const mode = rest[0], file = rest[1], p = resolve(file || '');
        if (!isFile(p)) return { err: `chmod: cannot access '${file}': No such file or directory` };
        const cur = L.modes[p] || { m: '-rw-r--r--', o: L.user, g: L.user };
        if (cur.o !== L.user) return { err: `chmod: changing permissions of '${file}': Operation not permitted` };
        let bits = cur.m.slice(1).split('');
        if (/^[0-7]{3}$/.test(mode)) bits = mode.split('').flatMap(d => { d = +d; return [d & 4 ? 'r' : '-', d & 2 ? 'w' : '-', d & 1 ? 'x' : '-']; });
        else if (/^[ugoa]*[+-][rwx]+$/.test(mode)) { const add = mode.includes('+'); const [who, perms] = mode.split(/[+-]/); const idx = { u: [0], g: [1], o: [2], a: [0, 1, 2] }; const groups = who ? [...new Set(who.split('').flatMap(w => idx[w]))] : [0, 1, 2]; groups.forEach(g => perms.split('').forEach(c => { const off = g * 3 + 'rwx'.indexOf(c); bits[off] = add ? c : '-'; })); }
        else return { err: `chmod: invalid mode: '${mode}'` };
        L.modes[p] = { ...cur, m: '-' + bits.join('') }; return { text: '' };
      }
      case 'sudo': return { err: `${L.user} is not in the sudoers file. This incident will be reported.` };
      case 'rm': return { err: 'rm: this lab is read-only' };
      case 'ssh': case 'ftp': return { err: `${cmd}: connections are disabled in this lab` };
      default: {
        if (cmd.startsWith('./') || cmd.startsWith('/')) {
          const p = resolve(cmd);
          if (!isFile(p)) return { err: `bash: ${cmd}: No such file or directory` };
          const md = L.modes && L.modes[p];
          const own = !md || md.o === L.user;
          const canExec = md && (own ? md.m[3] === 'x' : md.m[9] === 'x');
          if (!canExec) return { err: `bash: ${cmd}: Permission denied` };
          return { text: (L.run && L.run[p]) || '' };
        }
        return { err: `${cmd}: command not found. Type help to see available commands.` };
      }
    }
  }

  function exec(line) {
    print(`<span class="p">${esc(promptEl.textContent)}</span> ${esc(line)}`);
    if (!line.trim()) return;
    hist.push(line); hIdx = hist.length;
    if (line.trim() === 'clear') { out.innerHTML = ''; return; }
    const stages = line.split('|').map(s => tokenize(s.trim())).filter(s => s.length);
    let data = null, res;
    for (const st of stages) { res = run(st, data); if (res.err) break; data = res.text != null ? res.text : ''; }
    const show = () => { if (res.err) print(`<span class="e">${esc(res.err)}</span>`); else if (res.html) print(res.html); else if (res.text) print(esc(res.text)); };
    if (res.slow) { inp.disabled = true; print('<span class="d">Scanning...</span>'); setTimeout(() => { out.lastChild.remove(); show(); inp.disabled = false; inp.focus(); }, 900); }
    else show();
  }

  inp.addEventListener('keydown', e => {
    if (e.key === 'Enter') { const v = inp.value; inp.value = ''; exec(v); }
    else if (e.key === 'ArrowUp') { if (hIdx > 0) { hIdx--; inp.value = hist[hIdx]; } e.preventDefault(); }
    else if (e.key === 'ArrowDown') { if (hIdx < hist.length - 1) { hIdx++; inp.value = hist[hIdx]; } else { hIdx = hist.length; inp.value = ''; } e.preventDefault(); }
    else if (e.key === 'l' && e.ctrlKey) { out.innerHTML = ''; e.preventDefault(); }
  });
}

/* ============================== WEB LAB (SQLi simulation) ============================== */
function mountWebLab() {
  const lab = document.getElementById('lab');
  lab.innerHTML = `<div class="webapp"><div class="browser-bar"><span>←</span><span class="url">http://10.10.22.9/login</span></div>
    <div class="webapp-body"><div class="eyebrow">Practice app · Northwind Staff Portal</div><h3>Staff sign in</h3>
      <label for="wu">Username<input id="wu" autocomplete="off" spellcheck="false"></label>
      <label for="wp">Password<input id="wp" autocomplete="off" spellcheck="false"></label>
      <button class="btn" id="wgo">Sign in</button>
      <div><div class="eyebrow" style="margin-bottom:6px">Query the server will run</div><div class="sqlbox" id="sql"></div></div>
      <div class="result" id="wres" hidden></div></div></div>
    <div class="lab-note">This app is a simulation that runs in your browser. No real database or server is involved.</div>`;
  const u = document.getElementById('wu'), p = document.getElementById('wp'), sql = document.getElementById('sql'), res = document.getElementById('wres');
  const USERS = [{ username: 'admin', password: 'X9!long-random-pass' }, { username: 'priya', password: 'Tut0r!2026' }];

  function render() {
    // Build the query as plain-text segments, then style user input and anything after a SQL comment.
    const segs = [];
    const addInput = v => { const i = v.indexOf("'"); if (i < 0) segs.push({ t: v }); else { segs.push({ t: v.slice(0, i) }); segs.push({ t: v.slice(i), inj: true }); } };
    segs.push({ t: "SELECT * FROM users\nWHERE username = '" }); addInput(u.value);
    segs.push({ t: "' AND password = '" }); addInput(p.value); segs.push({ t: "'" });
    const full = segs.map(s => s.t).join('');
    const cut = full.search(/--|#/);
    let pos = 0, html = '';
    segs.forEach(s => {
      for (const ch of s.t) {
        const cls = [s.inj ? 'inj' : '', cut >= 0 && pos >= cut ? 'cm' : ''].filter(Boolean).join(' ');
        html += cls ? `<span class="${cls}">${esc(ch)}</span>` : esc(ch);
        pos++;
      }
    });
    sql.innerHTML = html;
  }

  // Very small evaluator that mimics how the vulnerable query behaves.
  function evaluate(user, pass) {
    let where = `username = '${user}' AND password = '${pass}'`;
    const cm = where.search(/--|#/); if (cm >= 0) where = where.slice(0, cm);
    const quotes = (where.match(/'/g) || []).length;
    if (quotes % 2 !== 0) return { error: "SQL syntax error near '" + where.slice(-20) + "'" };
    const orTrue = /\bor\b\s*('?)(\w+)\1\s*=\s*\1\2\1/i.test(where);
    if (orTrue) return { row: USERS[0] };
    const m = where.match(/^username = '(.*?)'(?:\s+AND\s+password = '(.*?)')?\s*$/i);
    if (!m) return { row: null };
    const found = USERS.find(x => x.username === m[1] && (m[2] === undefined || x.password === m[2]));
    return { row: found || null };
  }

  function go() {
    const r = evaluate(u.value, p.value);
    res.hidden = false;
    if (r.error) { res.className = 'result no'; res.textContent = 'Server error 500: ' + r.error + '. A crash like this tells an attacker the input reaches the database.'; }
    else if (r.row && r.row.username === 'admin') { res.className = 'result ok'; res.innerHTML = `Signed in as <strong>admin</strong>. Welcome to the staff dashboard.<br>Flag: <code>SC{never_trust_user_input}</code>`; }
    else if (r.row) { res.className = 'result ok'; res.innerHTML = `Signed in as <strong>${esc(r.row.username)}</strong>.`; }
    else { res.className = 'result no'; res.textContent = 'Invalid username or password.'; }
  }
  u.addEventListener('input', render); p.addEventListener('input', render);
  [u, p].forEach(el => el.addEventListener('keydown', e => { if (e.key === 'Enter') go(); }));
  document.getElementById('wgo').onclick = go;
  render();
}

function mountXssLab() {
  const lab = document.getElementById('lab');
  lab.innerHTML = `<div class="webapp"><div class="browser-bar"><span>←</span><span class="url" id="xurl">http://10.10.40.3/search</span></div>

      <label style="flex-direction:row;align-items:center;gap:8px;color:var(--ink)"><input type="checkbox" id="xsafe"> Safe mode (encode output)</label>
      <div><div class="eyebrow" style="margin-bottom:6px">HTML the server sends back</div><div class="sqlbox" id="xsrc"></div></div>
      <div><div class="eyebrow" style="margin-bottom:6px">What the browser shows</div><div class="result no" id="xout" style="color:var(--ink)">Search for something to see results.</div></div>
      <div class="result ok" id="xalert" hidden></div></div></div>
    <div class="lab-note">This app is a simulation. Your input is never actually run as code.</div>`;
  const q = document.getElementById('xq'), safe = document.getElementById('xsafe');
  const src = document.getElementById('xsrc'), out = document.getElementById('xout'), al = document.getElementById('xalert');
  const enc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  function go() {
    const v = q.value;
    document.getElementById('xurl').textContent = 'http://10.10.40.3/search?q=' + encodeURIComponent(v);
    const echoed = safe.checked ? enc(v) : v;
    src.textContent = `<p>You searched for: ${echoed}</p>\n<p>0 books found.</p>`;
    const scripty = /<script[\s>]|<\w+[^>]*\son\w+\s*=|javascript:/i.test(v);
    // Show formatting tags as formatting (unsafe mode only), everything else as text. Nothing is executed.
    let shown = esc(v);
    if (!safe.checked) shown = shown.replace(/&lt;(\/?)(b|i|u|em|strong)&gt;/gi, '<$1$2>').replace(/&lt;script[\s\S]*?&lt;\/script&gt;/gi, '');
    out.innerHTML = `You searched for: ${shown}<br>0 books found.`;
    if (scripty && !safe.checked) { al.hidden = false; al.innerHTML = `The page ran your script. In a real browser a pop-up would appear here.<br>Flag: <code>SC{reflected_xss_found}</code>`; }
    else if (scripty) { al.hidden = false; al.className = 'result ok'; al.innerHTML = 'Safe mode encoded your input, so the browser showed it as plain text. No script ran.'; }
    else al.hidden = true;
  }
  document.getElementById('xgo').onclick = go;
  q.addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  safe.addEventListener('change', () => { if (q.value) go(); });
}

    if (!p) { body.innerHTML = `<div class="eyebrow">Northwind School · My profile</div><h3>404 Not Found</h3><p style="margin:0;color:var(--muted)">No user with id ${esc(inp.value)}.</p>`; return; }
    body.innerHTML = `<div class="eyebrow">Northwind School · My profile</div><h3>${esc(p.name)}</h3>
      <div class="tbl-wrap"><table class="lesson" style="border-collapse:collapse;font-size:14px;width:100%"><tr><td style="color:var(--muted);padding:4px 8px 4px 0">Role</td><td>${esc(p.role)}</td></tr><tr><td style="color:var(--muted);padding:4px 8px 4px 0">Email</td><td>${esc(p.email)}</td></tr></table></div>
      <div class="result ${p.name === 'admin' ? 'ok' : 'no'}" style="${p.name === 'admin' ? '' : 'color:var(--ink)'}">${p.note}</div>`;
  }
  document.getElementById('igo').onclick = show;
  inp.addEventListener('keydown', e => { if (e.key === 'Enter') show(); });
  show();
}

/* ============================== PYTHON LAB (Pyodide) ============================== */
let pyLoading = null;
function loadPython() {
  if (!pyLoading) {
    pyLoading = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/pyodide@0.26.4/pyodide.js';
      s.onload = () => window.loadPyodide({ indexURL: 'https://cdn.jsdelivr.net/npm/pyodide@0.26.4/' }).then(resolve, reject);
      s.onerror = () => reject(new Error('script blocked'));
      document.head.appendChild(s);
    }).catch(e => { pyLoading = null; throw e; });
  }
  return pyLoading;
}

function mountPython(starter) {
  const lab = document.getElementById('lab');
  lab.innerHTML = `<div class="lab-frame"><div class="lab-bar"><span class="dot"></span><span>Python 3 editor</span><span class="ip" id="pystatus">ready</span></div>
    <textarea class="py-editor" id="pycode" aria-label="Python code" spellcheck="false" autocapitalize="off"></textarea>
    <div class="py-actions"><button class="btn small" id="pyrun">Run ▶</button><button class="btn small ghost py-ghost" id="pyclear">Clear output</button><span class="d" style="font-size:12px;color:var(--term-dim)">Ctrl + Enter to run</span></div>
    <div class="term py-out" id="pyout"></div></div>
    <div class="lab-note">Real Python running in your browser. Nothing is sent to a server.</div>`;
  const code = document.getElementById('pycode'), out = document.getElementById('pyout'), status = document.getElementById('pystatus');
  code.value = starter || '';
  const write = (t, cls) => { const d = document.createElement('div'); if (cls) d.className = cls; d.textContent = t; out.appendChild(d); out.scrollTop = out.scrollHeight; };
  async function run() {
    const btn = document.getElementById('pyrun');
    btn.disabled = true;
    let py;
    try {
      if (!pyLoading) status.textContent = 'loading Python…';
      py = await loadPython();
    } catch (e) {
      status.textContent = 'unavailable';
      write('Python could not load here. Open the site at https://anayinjnani25.github.io/shellcamp/ to use the editor.', 'e');
      btn.disabled = false; return;
    }
    status.textContent = 'running…';
    write('>>> run', 'p');
    py.setStdout({ batched: s => write(s) });
    py.setStderr({ batched: s => write(s, 'e') });
    try { await py.runPythonAsync(code.value); }
    catch (e) { const lines = String(e.message || e).trim().split('\n'); write(lines.slice(-3).join('\n'), 'e'); }
    status.textContent = 'ready'; btn.disabled = false;
  }
  document.getElementById('pyrun').onclick = run;
  document.getElementById('pyclear').onclick = () => { out.innerHTML = ''; };
  code.addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); run(); }
    else if (e.key === 'Tab' && !e.shiftKey) { e.preventDefault(); const st = code.selectionStart; code.setRangeText('    ', st, code.selectionEnd, 'end'); }
  });
  document.querySelectorAll('pre.py').forEach(pre => {
    const b = document.createElement('button');
    b.className = 'linkbtn try-btn'; b.textContent = 'Try it ↗';
    b.onclick = () => { code.value = pre.textContent; code.focus(); toast('Copied into the editor'); };
    pre.after(b);
  });
}

/* ============================== ROUTER ============================== */
function route() {
  const h = location.hash.slice(1) || 'home';
  document.querySelectorAll('nav.main a').forEach(a => a.classList.toggle('on', a.dataset.nav === h || (h.startsWith('room-') && a.dataset.nav === 'paths')));
  if (h.startsWith('room-')) viewRoom(h.slice(5));
  else if (h === 'paths') viewPaths();
  else if (h === 'leaderboard') viewLeaderboard();
  else if (h === 'glossary') viewGlossary();
  else if (h === 'progress') viewProgress();
  else viewHome();
  renderStats();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);
route();
