<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Learn ethical hacking from scratch with guided rooms and browser-based practice labs.">
</head>
<body>
<title>Shellcamp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky top bar, centered 1120px column; room pages split into lesson tasks (left) and a sticky lab panel (right). */
:root {
  --bg: #F2F4F8;
  --surface: #FFFFFF;
  --surface-2: #E9EDF4;
  --ink: #131A2A;
  --muted: #586379;
  --line: #D6DCE6;
  --accent: #2E47F0;
  --accent-soft: #E3E7FE;
  --on-accent: #FFFFFF;
  --flag: #A55F00;
  --flag-soft: #FBEFD9;
  --ok: #18804A;
  --ok-soft: #DDF3E6;
  --bad: #C22B3A;
  --term-bg: #0E131E;
  --term-fg: #D3DBE8;
  --term-dim: #6F7D96;
  --term-prompt: #8FA2FF;
  --term-hl: #F2B24C;
  --f-display: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0B0F17; --surface: #131927; --surface-2: #1A2233; --ink: #E5E9F1; --muted: #8C97AB;
    --line: #253046; --accent: #7D8EFF; --accent-soft: #1E2650; --on-accent: #0B0F17;
    --flag: #F2A83C; --flag-soft: #2E2312; --ok: #45C982; --ok-soft: #11291C; --bad: #FF6D7A;
    --term-bg: #070A10; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0B0F17; --surface: #131927; --surface-2: #1A2233; --ink: #E5E9F1; --muted: #8C97AB;
  --line: #253046; --accent: #7D8EFF; --accent-soft: #1E2650; --on-accent: #0B0F17;
  --flag: #F2A83C; --flag-soft: #2E2312; --ok: #45C982; --ok-soft: #11291C; --bad: #FF6D7A;
  --term-bg: #070A10; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
a { color: var(--accent); }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: .01em; }
code, kbd { font-family: var(--f-mono); font-size: .9em; background: var(--surface-2); padding: .1em .35em; border-radius: 4px; }
pre { font-family: var(--f-mono); font-size: 13px; background: var(--surface-2); padding: 12px 14px; border-radius: 8px; overflow-x: auto; margin: 0; }
button, input { font: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar .wrap { display: flex; align-items: center; gap: 20px; min-height: 60px; flex-wrap: wrap; padding-block: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 20px; }
.logo-mark { width: 30px; height: 30px; border-radius: 7px; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; font-family: var(--f-mono); font-size: 14px; font-weight: 500; }
nav.main { display: flex; gap: 4px; flex-wrap: wrap; }
nav.main a { text-decoration: none; color: var(--muted); padding: 6px 12px; border-radius: 6px; font-weight: 500; }
nav.main a:hover { color: var(--ink); background: var(--surface-2); }
nav.main a.on { color: var(--accent); background: var(--accent-soft); }
.stats { margin-left: auto; display: flex; gap: 14px; align-items: center; font-variant-numeric: tabular-nums; flex-wrap: wrap; }
.stat { display: flex; flex-direction: column; line-height: 1.1; }
.stat b { font-family: var(--f-display); font-size: 17px; }
.stat span { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.rank-chip { font-family: var(--f-mono); font-size: 12px; padding: 4px 10px; border-radius: 999px; border: 1px solid var(--accent); color: var(--accent); white-space: nowrap; }

main { padding-block: 32px 64px; }
.eyebrow { font-family: var(--f-mono); font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

/* home */
.hero { display: grid; grid-template-columns: 1.1fr .9fr; gap: 32px; align-items: center; margin-bottom: 40px; }
.hero h1 { font-size: clamp(34px, 5vw, 54px); margin: 10px 0 14px; }
.hero h1 em { font-style: normal; color: var(--accent); }
.hero p { color: var(--muted); max-width: 52ch; margin: 0 0 20px; font-size: 16px; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: 0; cursor: pointer; text-decoration: none; background: var(--accent); color: var(--on-accent); padding: 10px 18px; border-radius: 8px; font-weight: 600; }
.btn:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { padding: 6px 12px; font-size: 14px; }
.hero-actions { display: flex; gap: 10px; flex-wrap: wrap; }
.hero-term { background: var(--term-bg); color: var(--term-fg); font-family: var(--f-mono); font-size: 13px; border-radius: var(--radius); padding: 16px 18px; min-width: 0; line-height: 1.7; white-space: pre-wrap; overflow-x: auto; }
.hero-term .p { color: var(--term-prompt); }
.hero-term .h { color: var(--term-hl); }
.hero-term .d { color: var(--term-dim); }
.rules { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 40px; }
.rule { border-top: 2px solid var(--ink); padding-top: 12px; }
.rule h3 { font-size: 17px; margin-bottom: 6px; }
.rule p { margin: 0; color: var(--muted); font-size: 14px; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin: 8px 0 16px; flex-wrap: wrap; }
.section-head h2 { font-size: 24px; }

/* path & room cards */
.path { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; margin-bottom: 18px; }
.path-top { display: flex; justify-content: space-between; gap: 16px; align-items: flex-start; flex-wrap: wrap; margin-bottom: 14px; }
.path-top h3 { font-size: 21px; }
.path-top p { margin: 4px 0 0; color: var(--muted); max-width: 60ch; }
.meter { height: 6px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.path-progress { min-width: 170px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.path-progress .meter { margin-top: 6px; }
.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }
.room-card { display: flex; flex-direction: column; gap: 8px; text-decoration: none; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 14px; transition: border-color .15s, transform .15s; }
.room-card:hover { border-color: var(--accent); transform: translateY(-2px); }
.room-card h4 { margin: 0; font-family: var(--f-display); font-size: 17px; }
.room-card p { margin: 0; font-size: 13.5px; color: var(--muted); flex: 1; }
.room-meta { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); font-family: var(--f-mono); flex-wrap: wrap; }
.diff { padding: 1px 8px; border-radius: 99px; font-weight: 500; }
.diff.easy { background: var(--ok-soft); color: var(--ok); }
.diff.medium { background: var(--flag-soft); color: var(--flag); }
.done-tag { margin-left: auto; color: var(--ok); font-weight: 500; }

/* room page */
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 10px; }
.crumbs a { color: var(--muted); }
.room-head { display: flex; justify-content: space-between; gap: 20px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 24px; padding-bottom: 20px; border-bottom: 1px solid var(--line); }
.room-head h1 { font-size: clamp(28px, 4vw, 40px); margin: 6px 0 8px; }
.room-head p { margin: 0; color: var(--muted); max-width: 62ch; }
.room-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 460px); gap: 24px; align-items: start; }
.room-grid.nolab { grid-template-columns: minmax(0, 760px); }
.tasks { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.task { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.task > summary { list-style: none; cursor: pointer; padding: 14px 18px; display: flex; gap: 12px; align-items: center; }
.task > summary::-webkit-details-marker { display: none; }
.task-num { font-family: var(--f-mono); font-size: 12px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px; white-space: nowrap; }
.task.complete .task-num { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.task > summary h3 { font-size: 17px; flex: 1; }
.chev { transition: transform .2s; color: var(--muted); }
.task[open] .chev { transform: rotate(90deg); }
.task-body { padding: 0 18px 18px; border-top: 1px solid var(--line); }
.task-body > .lesson { max-width: 68ch; }
.task-body .lesson p, .task-body .lesson ul, .task-body .lesson pre, .task-body .lesson table { margin: 14px 0; }
.task-body .lesson ul { padding-left: 20px; }
.task-body .lesson li { margin: 4px 0; }
.tbl-wrap { overflow-x: auto; }
.lesson table { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.lesson th, .lesson td { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--line); }
.lesson th { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
.callout { border-left: 3px solid var(--flag); background: var(--flag-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 14px; }
.questions { display: flex; flex-direction: column; gap: 14px; margin-top: 18px; padding-top: 16px; border-top: 1px dashed var(--line); }
.q label { display: block; font-weight: 500; margin-bottom: 6px; }
.q-row { display: flex; gap: 8px; flex-wrap: wrap; }
.q-row input { flex: 1 1 200px; min-width: 0; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-family: var(--f-mono); font-size: 14px; }
.q-row input.wrong { border-color: var(--bad); animation: shake .3s; }
.q.solved input { border-color: var(--ok); background: var(--ok-soft); color: var(--ok); }
.q.solved .btn { background: var(--ok); }
.q-foot { display: flex; gap: 12px; align-items: center; font-size: 13px; margin-top: 6px; color: var(--muted); flex-wrap: wrap; }
.linkbtn { background: none; border: 0; color: var(--accent); cursor: pointer; padding: 0; font-size: 13px; }
.hint { font-size: 13.5px; color: var(--muted); background: var(--surface-2); padding: 8px 12px; border-radius: 8px; margin-top: 8px; }
.pts { font-family: var(--f-mono); }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* lab panel */
.lab { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 76px); min-width: 0; }
.lab-frame { background: var(--term-bg); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--line); }
.lab-bar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: rgba(255,255,255,.04); border-bottom: 1px solid rgba(255,255,255,.07); font-family: var(--f-mono); font-size: 12px; color: var(--term-dim); }
.lab-bar .dot { width: 8px; height: 8px; border-radius: 50%; background: #3CC47A; box-shadow: 0 0 0 3px rgba(60,196,122,.18); }
.lab-bar .ip { margin-left: auto; color: var(--term-hl); }
.term { height: 440px; overflow-y: auto; padding: 12px 14px; font-family: var(--f-mono); font-size: 13px; color: var(--term-fg); line-height: 1.55; white-space: pre-wrap; word-break: break-word; cursor: text; }
.term .p { color: var(--term-prompt); }
.term .e { color: #FF8A95; }
.term .d { color: var(--term-dim); }
.term .h { color: var(--term-hl); }
.term-in { display: flex; gap: 8px; }
.term-in input { flex: 1; min-width: 0; background: transparent; border: 0; outline: 0; color: var(--term-fg); font-family: var(--f-mono); font-size: 13px; padding: 0; caret-color: var(--term-hl); }
.lab-note { font-size: 12.5px; color: var(--muted); margin-top: 8px; }
.cheats { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.cheats button { font-family: var(--f-mono); font-size: 12px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 3px 8px; cursor: pointer; }
.cheats button:hover { border-color: var(--accent); }

/* python lab */
.py-editor { display: block; width: 100%; height: 250px; resize: vertical; background: var(--term-bg); color: var(--term-fg); border: 0; border-bottom: 1px solid rgba(255,255,255,.07); padding: 12px 14px; font-family: var(--f-mono); font-size: 13px; line-height: 1.55; tab-size: 4; outline: none; white-space: pre; overflow: auto; }
.py-actions { display: flex; gap: 8px; align-items: center; padding: 8px 12px; border-bottom: 1px solid rgba(255,255,255,.07); flex-wrap: wrap; }
.py-ghost { color: var(--term-fg); border-color: rgba(255,255,255,.18); }
.py-ghost:hover { background: rgba(255,255,255,.06); }
.py-out { height: 190px; }
.try-btn { display: block; margin-top: -8px; margin-bottom: 10px; }

/* fake web app */
.webapp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.browser-bar { display: flex; gap: 8px; align-items: center; background: var(--surface-2); padding: 8px 12px; font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.browser-bar .url { flex: 1; background: var(--bg); border-radius: 6px; padding: 3px 10px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.webapp-body { padding: 22px; display: flex; flex-direction: column; gap: 12px; }
.webapp-body h3 { font-size: 20px; }
.webapp-body label { font-size: 13px; color: var(--muted); display: flex; flex-direction: column; gap: 4px; }
.webapp-body input { padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font-family: var(--f-mono); }
.sqlbox { font-family: var(--f-mono); font-size: 12.5px; background: var(--term-bg); color: var(--term-fg); padding: 10px 12px; border-radius: 8px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }
.sqlbox .inj { color: var(--term-hl); }
.sqlbox .cm { color: var(--term-dim); text-decoration: line-through; }
.result { padding: 10px 12px; border-radius: 8px; font-size: 14px; }
.result.ok { background: var(--ok-soft); color: var(--ok); }
.result.no { background: var(--surface-2); color: var(--bad); }

/* leaderboard */
.board { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.board-row { display: grid; grid-template-columns: 48px minmax(0, 1fr) 140px 90px; gap: 12px; align-items: center; padding: 12px 18px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.board-row:last-child { border-bottom: 0; }
.board-row.head { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); background: var(--surface-2); }
.board-row.me { background: var(--accent-soft); }
.board-row .pos { font-family: var(--f-display); font-weight: 700; font-size: 18px; }
.board-row .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board-row .rk { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.board-row .sc { text-align: right; font-family: var(--f-display); font-weight: 600; }
.ranks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; margin-top: 24px; }
.rank-tile { border: 1px solid var(--line); border-radius: 8px; padding: 12px; background: var(--surface); }
.rank-tile.cur { border-color: var(--accent); }
.rank-tile b { font-family: var(--f-display); display: block; }
.rank-tile span { font-size: 12px; color: var(--muted); font-family: var(--f-mono); }

.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 8px; font-weight: 600; transform: translateY(20px); opacity: 0; transition: .25s; pointer-events: none; z-index: 20; }
.toast.show { transform: none; opacity: 1; }
/* level in top bar */
.lvl { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink); padding: 4px 8px; border-radius: 8px; }
.lvl:hover { background: var(--surface-2); }
.lvl-badge { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: var(--on-accent); font-family: var(--f-display); font-weight: 700; font-size: 15px; flex: none; }
.lvl-body { display: flex; flex-direction: column; gap: 3px; width: 120px; }
.lvl-top { display: flex; justify-content: space-between; gap: 6px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.lvl-top b { color: var(--ink); font-family: var(--f-display); font-size: 13px; }

/* progress page */
.muted { color: var(--muted); }
.prog-top { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr); gap: 16px; }
.prog-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; gap: 20px; align-items: center; flex-wrap: wrap; }
.big-lvl { width: 120px; height: 120px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; line-height: 1.1; }
.big-lvl b { font-family: var(--f-display); font-size: 46px; }
.big-lvl span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; }
.lvl-detail { flex: 1; min-width: 180px; }
.lvl-detail h3 { font-size: 24px; margin: 2px 0 12px; }
.lvl-detail p { margin: 8px 0 0; font-variant-numeric: tabular-nums; }
.meter.tall { height: 12px; }
.ring { width: 130px; height: 130px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ring > div { width: 100px; height: 100px; border-radius: 50%; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.1; }
.ring b { font-family: var(--f-display); font-size: 30px; }
.ring span { font-size: 12px; color: var(--muted); }
.tiles { flex: 1; min-width: 220px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; font-variant-numeric: tabular-nums; }
.tile b { font-family: var(--f-display); font-size: 22px; }
.tile small { font-size: 14px; color: var(--muted); font-weight: 500; }
.tile span { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.tile em { font-style: normal; font-size: 13px; color: var(--accent); margin-top: 2px; }
.here { margin-top: 16px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; background: var(--accent-soft); border: 1px solid var(--accent); border-radius: var(--radius); padding: 16px 20px; }
.here h3 { font-size: 18px; margin: 4px 0; }
.here p { margin: 0; color: var(--muted); }
.here.done { background: var(--ok-soft); border-color: var(--ok); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 6px; }
.st { width: 12px; height: 12px; border-radius: 50%; display: inline-block; flex: none; border: 2px solid var(--line); background: var(--surface); }
.st.done { background: var(--ok); border-color: var(--ok); }
.st.started { background: linear-gradient(90deg, var(--accent) 50%, var(--surface) 50%); border-color: var(--accent); }
.st.here-dot { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
.roadmap { display: flex; flex-direction: column; gap: 12px; }
.rm-path { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 20px; }
.rm-head { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  'stay-safe-online': [
    `<h4>How attackers really get passwords</h4>
<ul><li><strong>Data breaches</strong>: a site gets hacked and its password database leaks. Billions of leaked passwords are traded online.</li><li><strong>Guessing</strong>: trying the most common passwords (123456, password, qwerty) against many accounts.</li><li><strong>Phishing</strong>: a fake login page you type the password into yourself.</li><li><strong>Malware</strong>: a keylogger that records what you type.</li></ul>
<h4>Why length wins</h4>
<p>Every extra character multiplies the number of possibilities. With the 26 lowercase letters alone, 8 characters give about 200 billion combinations, but 16 characters give about 44,000 billion billion. A computer that can try billions per second finishes the first quickly and never finishes the second.</p>
<p>A <strong>passphrase</strong> of four or more random words is long and still easy to remember: <code>violin-ocean-pepper-lantern</code>.</p>
<h4>Check your own accounts</h4>
<p>The free site <em>haveibeenpwned.com</em> tells you whether your email address appears in known breaches. If it does, change the password on that site and anywhere you reused it.</p>`,
    `<h4>Not all 2FA is equally strong</h4>
<div class="tbl-wrap"><table><tr><th>Method</th><th>Strength</th><th>Weakness</th></tr>
<tr><td>SMS code</td><td>Better than nothing</td><td>SIM swapping: an attacker convinces your mobile provider to move your number to their SIM</td></tr>
<tr><td>Authenticator app</td><td>Good</td><td>A convincing fake site can still ask you for the code</td></tr>
<tr><td>Push approval</td><td>Good</td><td>"MFA fatigue": attackers send many prompts hoping you tap Approve</td></tr>
<tr><td>Security key / passkey</td><td>Best</td><td>Checks the real website address, so phishing sites cannot use it</td></tr></table></div>
<p class="mistake"><strong>Common mistake:</strong> approving a login prompt you did not start. If you get one, someone already has your password. Deny it and change the password.</p>
<h4>Save your recovery codes</h4>
<p>When you turn on 2FA, sites give you backup codes. Store them in your password manager or print them. Without them, losing your phone can lock you out for good.</p>`,
    `<h4>A checklist for any suspicious message</h4>
<ul><li><strong>Sender</strong>: does the address match the real company's domain exactly? Look for swapped letters, extra words (<code>-support</code>, <code>-secure</code>) or a different ending (<code>.co</code> instead of <code>.com</code>).</li><li><strong>Links</strong>: hover over (or long-press) a link to see where it really goes before clicking.</li><li><strong>Pressure</strong>: deadlines, threats, prizes and "your account will be closed" are designed to stop you thinking.</li><li><strong>Requests</strong>: real companies do not ask for your password, 2FA code or card number by email.</li><li><strong>Attachments</strong>: unexpected invoices, ZIP files and documents asking you to "enable content" are classic malware delivery.</li></ul>
<h4>Other kinds of phishing</h4>
<ul><li><strong>Spear phishing</strong>: written for one specific person, using details about them.</li><li><strong>Smishing</strong>: by SMS ("Your parcel could not be delivered...").</li><li><strong>Vishing</strong>: by phone call, often pretending to be the bank or IT support.</li></ul>
<p>If you are unsure, contact the company using a phone number or website you already know, never the details in the message.</p>`
  ],
  'first-shell': [
    `<h4>Anatomy of the prompt</h4>
<pre>student@sc-lab:~$
│       │      │ └─ $ = normal user (# means root)
│       │      └─── current folder (~ = your home folder)
│       └────────── machine name
└────────────────── your username</pre>
<p>The prompt alone tells you who you are, where you are, and whether you are root. Hackers read it every time they land on a new machine.</p>
<h4>The Linux folder tree</h4>
<p>Linux has one tree starting at <code>/</code> ("root" of the file system, not to be confused with the root user):</p>
<ul><li><code>/home</code>: one folder per user.</li><li><code>/etc</code>: system settings and config files.</li><li><code>/var/log</code>: log files.</li><li><code>/tmp</code>: temporary files. Anyone can write here, so attackers like it.</li><li><code>/root</code>: the root user's home folder.</li></ul>`,
    `<h4>Absolute and relative paths</h4>
<p>An <strong>absolute</strong> path starts with <code>/</code> and works from anywhere: <code>/home/student/notes.txt</code>. A <strong>relative</strong> path starts from where you are now: if you are in <code>/home/student</code>, then <code>notes.txt</code> means the same file.</p>
<ul><li><code>.</code> means "this folder".</li><li><code>..</code> means "the folder above".</li><li><code>~</code> means "my home folder".</li></ul>
<h4>Time-savers</h4>
<ul><li>Press <kbd>Tab</kbd> to auto-complete file names on a real Linux terminal.</li><li>Press <kbd>↑</kbd> to bring back your last command. This works in the lab too.</li><li><code>clear</code> (or <kbd>Ctrl</kbd> + <kbd>L</kbd>) wipes the screen.</li></ul>
<p class="mistake"><strong>Common mistake:</strong> Linux is case-sensitive. <code>Notes.txt</code> and <code>notes.txt</code> are two different files.</p>`,
    `<h4>Why hide files at all?</h4>
<p>Dot files are not a security feature. They exist to keep settings out of the way: <code>.bashrc</code> holds your shell settings, <code>.ssh/</code> holds your SSH keys, and <code>.bash_history</code> records the commands you typed.</p>
<h4>Gold for attackers</h4>
<p>Because people forget they exist, hidden files often hold secrets. After landing on a machine, a tester checks:</p>
<ul><li><code>.bash_history</code>: people sometimes type passwords straight into commands.</li><li><code>.ssh/</code>: a private key here may log in to other servers.</li><li>Config files like <code>.env</code> or <code>.git-credentials</code>, which often contain passwords and API keys.</li></ul>
<p>Combine flags to see everything with details: <code>ls -la</code>. The <code>-l</code> part shows permissions, owner and size. You will use it in the next room.</p>`,
    `<h4>Reading /etc/passwd</h4>
<p>Each line has seven fields separated by colons:</p>
<pre>priya:x:1001:1001:Priya,,,:/home/priya:/bin/bash
│     │ │    │    │        │           └─ login shell
│     │ │    │    │        └───────────── home folder
│     │ │    │    └────────────────────── full name / comment
│     │ │    └─────────────────────────── group ID
│     │ └──────────────────────────────── user ID (0 = root)
│     └────────────────────────────────── x = password stored elsewhere
└──────────────────────────────────────── username</pre>
<p>Despite the name, passwords are not in this file. The hashed passwords live in <code>/etc/shadow</code>, which only root can read.</p>
<h4>Spotting real people</h4>
<p>Accounts with a shell of <code>/usr/sbin/nologin</code> are service accounts that cannot log in. Accounts with <code>/bin/bash</code> and a folder in <code>/home</code> usually belong to real people, and those are what testers note down.</p>`
  ],
  'linux-permissions': [
    `<h4>Owner, group, others</h4>
<p>Every file has exactly one owner and one group. When you try to use a file, Linux checks in this order and stops at the first match:</p>
<ul><li>Are you the <strong>owner</strong>? Use the first three letters.</li><li>Otherwise, are you in the file's <strong>group</strong>? Use the middle three.</li><li>Otherwise, you are <strong>others</strong>. Use the last three.</li></ul>
<h4>What r, w and x mean for folders</h4>
<p>On a folder the letters mean something slightly different:</p>
<ul><li><code>r</code>: list the names of files inside.</li><li><code>w</code>: create, rename or delete files inside.</li><li><code>x</code>: enter the folder with <code>cd</code> and reach files in it.</li></ul>
<p>Root ignores these rules entirely, which is why becoming root is the goal of so many attacks.</p>`,
    `<h4>Real-world permission mistakes</h4>
<ul><li><strong>World-readable secrets</strong>: a config file with a database password set to <code>644</code>, so every user on the server can read it. That is exactly what <code>app.conf</code> shows in the lab.</li><li><strong>World-writable scripts</strong>: a script that root runs every hour, but anyone can edit. An attacker adds one line and it runs as root.</li><li><strong>chmod 777 "to make it work"</strong>: gives everyone full rights. It fixes the error and creates a hole.</li></ul>
<h4>How to look for them</h4>
<p>On a real system, testers search for weak files with <code>find</code>. For example, this lists files anyone can write to:</p>
<pre>find / -type f -perm -o+w 2>/dev/null</pre>
<p>The <code>2>/dev/null</code> part hides the many "Permission denied" errors so only results are shown.</p>`,
    `<h4>Number form, step by step</h4>
<p>Each group of three letters becomes one digit: add r=4, w=2, x=1.</p>
<pre>rwx = 4+2+1 = 7
r-x = 4+0+1 = 5
r-- = 4+0+0 = 4
--- = 0

rwxr-xr-- = 7 5 4  →  chmod 754 file</pre>
<h4>Common settings</h4>
<div class="tbl-wrap"><table><tr><th>Number</th><th>Letters</th><th>Typical use</th></tr>
<tr><td>755</td><td>rwxr-xr-x</td><td>Programs and folders everyone may use</td></tr>
<tr><td>644</td><td>rw-r--r--</td><td>Normal files</td></tr>
<tr><td>600</td><td>rw-------</td><td>Private files: SSH keys, configs with passwords</td></tr>
<tr><td>700</td><td>rwx------</td><td>Private folders and scripts</td></tr></table></div>
<p>Try <code>chmod 600 app.conf</code> in the lab, then <code>ls -l</code>, to lock the config file down properly.</p>`
  ],
  'windows-basics': [
    `<h4>Why admins do not run as admin</h4>
<p>If you browse the web with full admin rights and click a malicious file, the malware gets admin rights too. With UAC, programs start with standard rights, and you must approve each request for more. Malware that cannot get past that prompt stays limited.</p>
<h4>Accounts on a work network</h4>
<p>At home, accounts exist on one PC. At schools and companies, accounts usually live on a central server called a <strong>Domain Controller</strong> running <strong>Active Directory</strong>. One account then works on every PC. That makes Active Directory a top target: whoever controls it controls every computer in the organisation.</p>`,
    `<h4>Try them on your own PC</h4>
<p>Open PowerShell (search for it in the Start menu) and run:</p>
<pre>whoami /groups      # which groups you belong to
ipconfig /all       # full network settings
tasklist            # running programs
netstat -ano        # open network connections and listening ports
systeminfo          # Windows version and installed updates</pre>
<p>These are exactly the commands a tester runs first after getting access to a Windows machine. <code>systeminfo</code> shows missing updates, and <code>whoami /groups</code> shows whether you are already an admin.</p>
<h4>PowerShell vs Command Prompt</h4>
<p>Command Prompt passes plain text between commands. PowerShell passes <strong>objects</strong> with named properties, which makes it far more powerful for automation. For example, this lists the five processes using the most memory:</p>
<pre>Get-Process | Sort-Object WorkingSet -Descending | Select-Object -First 5</pre>`,
    `<h4>Opening Event Viewer</h4>
<p>Press <kbd>Win</kbd> + <kbd>R</kbd>, type <code>eventvwr</code> and press Enter. Go to <em>Windows Logs → Security</em>. You may need to run it as administrator to see this log. Use <strong>Filter Current Log</strong> on the right to show one Event ID, such as 4625.</p>
<h4>Reading an event</h4>
<p>A failed logon event (4625) tells you the account name, the time, the logon type and the source network address. Logon type 3 means over the network; type 10 means Remote Desktop. Many 4625s with type 10 from an unknown IP mean someone is guessing Remote Desktop passwords from the internet.</p>
<h4>At scale</h4>
<p>One PC's log is easy to read by hand. A company with 5,000 PCs sends all their logs to a <strong>SIEM</strong> (Security Information and Event Management) system, which searches them together and raises alerts. Watching those alerts is the main job of a SOC analyst.</p>`
  ],
  'networking-101': [
    `<h4>Find your own addresses</h4>
<p>On Windows, run <code>ipconfig</code>. You will see your private IPv4 address (often <code>192.168.x.x</code>) and your <strong>default gateway</strong>, which is your router. To see your public IP, search "what is my IP" in a browser. The two are different because of <strong>NAT</strong> (Network Address Translation): your router swaps private addresses for its one public address on the way out.</p>
<h4>The private ranges</h4>
<pre>10.0.0.0    – 10.255.255.255
172.16.0.0  – 172.31.255.255
192.168.0.0 – 192.168.255.255</pre>
<p><code>127.0.0.1</code> is special: it always means "this computer", also called <strong>localhost</strong>.</p>
<h4>IPv6</h4>
<p>IPv4 has about 4.3 billion addresses, which is not enough for every device on Earth. <strong>IPv6</strong> uses 128-bit addresses written in hex, like <code>2001:db8::8a2e:370:7334</code>, and has enough for practically everything.</p>`,
    `<h4>How a port number is used</h4>
<p>When you visit a website, your browser connects to the server's port 443. Your own computer picks a random high port (like 51122) for its side of the conversation. So a connection is really four things: your IP and port, and the server's IP and port.</p>
<h4>Port ranges</h4>
<ul><li><strong>0–1023</strong>: well-known ports for standard services. On Linux only root can listen on these.</li><li><strong>1024–49151</strong>: registered ports used by specific applications, like 3306 for MySQL or 3389 for Remote Desktop.</li><li><strong>49152–65535</strong>: temporary ports your computer uses for its own side of connections.</li></ul>
<h4>Why open ports matter</h4>
<p>Every open port is a program listening for strangers. Each one is a possible way in. Defenders close every port that is not needed. Attackers scan for the ones that are left.</p>`,
    `<h4>The handshake as a phone call</h4>
<pre>You:    "Hello, can you hear me?"        → SYN
Server: "Yes, I hear you. Can you hear me?" → SYN-ACK
You:    "Yes. Let's talk."                → ACK</pre>
<p>Only after this does real data flow. Each side numbers its packets so missing ones can be detected and sent again.</p>
<h4>How scanners use it</h4>
<ul><li>Port <strong>open</strong>: the server answers SYN with SYN-ACK.</li><li>Port <strong>closed</strong>: the server answers with RST ("reset", meaning no one is listening).</li><li>Port <strong>filtered</strong>: no answer at all, usually because a firewall dropped the packet.</li></ul>
<p>That is exactly how Nmap decides what to print for each port, which you will see in the Recon room.</p>
<h4>The layers</h4>
<p>Networking is often explained in layers. Simplified: <strong>Application</strong> (HTTP, DNS) sits on <strong>Transport</strong> (TCP, UDP), which sits on <strong>Internet</strong> (IP addresses), which sits on <strong>Link</strong> (Wi-Fi, Ethernet, MAC addresses). Each layer only cares about its own job.</p>`,
    `<h4>What happens when you type a website name</h4>
<ul><li>Your computer checks its own cache: have I looked this up recently?</li><li>If not, it asks a <strong>DNS resolver</strong>, usually run by your internet provider or a service like 1.1.1.1.</li><li>The resolver asks a <strong>root server</strong>, which points to the servers for <code>.com</code>.</li><li>Those point to the domain's own <strong>authoritative</strong> server, which gives the final answer.</li><li>The answer is cached for a while, set by its TTL (time to live).</li></ul>
<h4>Try it</h4>
<pre>nslookup example.com            # A record
nslookup -type=mx gmail.com     # mail servers</pre>
<h4>Why attackers love DNS</h4>
<p>During recon, DNS reveals a company's subdomains (<code>vpn.</code>, <code>mail.</code>, <code>dev.</code>), and each one is a possible target. And if an attacker can change DNS answers, they can send victims to a fake site even when the victims type the right address.</p>`
  ],
  'web-101': [
    `<h4>See real requests yourself</h4>
<p>In Chrome or Edge, press <kbd>F12</kbd>, open the <strong>Network</strong> tab and reload a page. Every line is one request: the HTML, each image, each script. Click one to see its method, headers and response. This is the single most useful tool for learning web security.</p>
<h4>Parts of a URL</h4>
<pre>https://shop.example:443/products/view?id=42&amp;sort=price#reviews
└─┬─┘   └────┬─────┘ └┬┘└─────┬──────┘└──────┬────────┘└──┬──┘
scheme    host      port    path         query       fragment</pre>
<p>The <strong>query</strong> (after <code>?</code>) carries parameters to the server. These are some of the first things a tester changes, as you will in the Broken Access Control room.</p>
<h4>Headers</h4>
<p>Requests and responses carry headers: <code>Host</code> (which site), <code>User-Agent</code> (which browser), <code>Cookie</code> (your session), and <code>Server</code> in responses, which sometimes reveals the exact server software and version.</p>`,
    `<h4>Status codes worth memorising</h4>
<div class="tbl-wrap"><table><tr><th>Code</th><th>Meaning</th><th>What a tester thinks</th></tr>
<tr><td>200</td><td>OK</td><td>It exists and I can see it.</td></tr>
<tr><td>301 / 302</td><td>Redirect</td><td>Where does it send me, and what if I don't follow?</td></tr>
<tr><td>401</td><td>Unauthorized</td><td>I need to log in.</td></tr>
<tr><td>403</td><td>Forbidden</td><td>It exists, but I'm blocked. Is the block applied everywhere?</td></tr>
<tr><td>404</td><td>Not found</td><td>Nothing here.</td></tr>
<tr><td>500</td><td>Server error</td><td>My input broke something. Why?</td></tr></table></div>
<p class="mistake"><strong>Common mistake:</strong> treating 403 and 404 as the same. A 403 confirms something is there, which is useful information.</p>`,
    `<h4>The cookie flags</h4>
<ul><li><strong>HttpOnly</strong>: JavaScript cannot read the cookie, which blunts XSS.</li><li><strong>Secure</strong>: only sent over HTTPS, so it cannot be read on open Wi-Fi.</li><li><strong>SameSite</strong>: limits sending the cookie when another site triggers the request, which blocks some attacks that trick your browser into acting for you.</li></ul>
<h4>See your cookies</h4>
<p>In the developer tools (<kbd>F12</kbd>), open <strong>Application → Cookies</strong>. You will see each cookie's name, value and flags. Never share these values with anyone. To a website, whoever holds the session cookie <em>is</em> you.</p>
<h4>Logging out matters</h4>
<p>Clicking <strong>Log out</strong> tells the server to throw away the session, so a stolen cookie stops working. Just closing the tab often leaves the session alive, especially on shared computers.</p>`
  ]

  'python-security': {
    title: 'Python for Defenders', diff: 'medium', mins: 30, lab: 'python',
    starter: 'import hashlib\n\nprint(hashlib.sha256(b"hello").hexdigest())\n',
    summary: 'Use Python\'s built-in modules to check file hashes, decode Base64, catch lookalike domains and test password strength.',
    tasks: [
      { title: 'Hashing with hashlib', body: `
<p>Python's <code>hashlib</code> module computes hashes, the same fingerprints you met in the Hashes and Checksums room:</p>
<pre class="py">import hashlib

text = "shellcamp"
digest = hashlib.sha256(text.encode()).hexdigest()
print(digest)
print(digest[:8])   # first 8 characters</pre>
<p><code>.encode()</code> turns text into bytes, because hash functions work on bytes.</p>`,
        questions: [
          { id: 'pz1', q: 'What are the first 8 characters of the SHA-256 hash of "shellcamp"?', a: ['3feccade'], hint: 'Run the code block.', pts: 20 }
        ] },
      { title: 'Decoding Base64', body: `

encoded = "U0N7cHl0aG9uX2RlY29kZXN9"

        questions: [
          { id: 'pz2', q: 'What flag does the Base64 string decode to?', a: ['SC{python_decodes}'], hint: 'Run the code block.', pts: 20, flag: true }
        ] },
      { title: 'Catch lookalike domains', body: `
<p>Phishing domains swap letters for similar characters, like <code>0</code> for <code>o</code> or <code>1</code> for <code>l</code>. This checker undoes the swaps and compares against trusted domains:</p>
<pre class="py">trusted = ["paypal.com", "google.com", "microsoft.com"]
swaps = {"0": "o", "1": "l", "3": "e", "5": "s"}

def looks_fake(domain):
    cleaned = "".join(swaps.get(ch, ch) for ch in domain)
    return domain not in trusted and cleaned in trusted

inbox = ["paypal.com", "paypa1.com", "g00gle.com", "news.example.org", "micr0soft.com"]
for d in inbox:
    if looks_fake(d):
        print("SUSPICIOUS:", d)</pre>`,

        ] },

<pre class="py">def is_strong(pw):
    return (len(pw) >= 12
            and any(c.isdigit() for c in pw)
            and any(c.isupper() for c in pw)
            and any(c.islower() for c in pw))

for pw in ["Summer2026", "correct-Horse-7-battery", "PASSWORD123456"]:
    print(pw, is_strong(pw))</pre>
<p>Try adding your own rule, for example rejecting passwords that contain the word "password".</p>`,

        ] }
    ]
  },

  'hello-ethics': {
    title: 'Hello, Ethics', diff: 'easy', mins: 15, lab: null,
    summary: 'What ethical hacking is, the CIA triad, and the one rule you never break.',
    tasks: [
      { title: 'What is ethical hacking?', body: `
<p>Ethical hacking means finding security weaknesses <strong>with permission</strong>, so they can be fixed before criminals find them. The techniques are the same ones attackers use. Permission and intent are the difference.</p>
<ul><li><strong>White hat</strong>: hacks with permission. This is you.</li><li><strong>Black hat</strong>: hacks without permission, for harm or profit.</li><li><strong>Grey hat</strong>: hacks without permission but "means well". Still illegal.</li></ul>
<p class="callout">In a real job, a tester works under a signed <strong>scope</strong> document. It lists exactly which systems may be tested, when, and how. Anything outside scope is off limits.</p>`,
        questions: [
          { id: 'he1', q: 'What colour hat describes a hacker who works with permission?', a: ['white', 'white hat'], hint: 'The opposite of black.', pts: 10 },
          { id: 'he2', q: 'What is the document called that lists which systems you are allowed to test?', a: ['scope', 'the scope', 'scope document'], hint: 'One word, five letters, starts with S.', pts: 10 }
        ] },
      { title: 'The CIA triad', body: `
<p>Every security problem threatens at least one of three properties:</p>
<div class="tbl-wrap"><table><tr><th>Property</th><th>Meaning</th><th>Example attack</th></tr>
<tr><td>Confidentiality</td><td>Only the right people can read the data</td><td>A database leak</td></tr>
<tr><td>Integrity</td><td>Data is not changed without permission</td><td>Editing a bank balance</td></tr>
<tr><td>Availability</td><td>The system works when people need it</td><td>A DDoS that floods a website</td></tr></table></div>`,
        questions: [
          { id: 'he3', q: 'A DDoS attack knocks a website offline. Which part of the CIA triad does it hit?', a: ['availability'], hint: 'Can people still use it?', pts: 10 },
          { id: 'he4', q: 'An attacker secretly changes exam marks in a school database. Which property is broken?', a: ['integrity'], hint: 'The data was modified.', pts: 10 }
        ] },
      { title: 'The five phases of a pentest', body: `
<p>A penetration test follows a repeatable process:</p>
<ul><li><strong>Reconnaissance</strong>: gather public information about the target.</li><li><strong>Scanning</strong>: find live hosts, open ports and services.</li><li><strong>Gaining access</strong>: exploit a weakness.</li><li><strong>Maintaining access</strong>: escalate from a normal user to admin.</li><li><strong>Reporting</strong>: explain what you found and how to fix it.</li></ul>
<p>The report is what the client pays for. A hack nobody can understand or fix helps no one.</p>`,
        questions: [
          { id: 'he5', q: 'What is the first phase of a penetration test?', a: ['reconnaissance', 'recon'], hint: 'Gathering information. Often shortened to "recon".', pts: 10 },
          { id: 'he6', q: 'Which phase produces the document the client actually pays for?', a: ['reporting', 'report', 'the report'], hint: 'The last phase.', pts: 10 }
        ] }
    ]
  },

  'networking-101': {
    title: 'Networking 101', diff: 'easy', mins: 20, lab: null,
    summary: 'IP addresses, ports, TCP vs UDP and DNS. The map you need before you can scan anything.',
    tasks: [
      { title: 'IP addresses', body: `
<p>Every device on a network has an <strong>IP address</strong>, like a postal address for data. An IPv4 address is four numbers from 0 to 255, such as <code>192.168.1.10</code>. Each number is 8 bits, so the whole address is 32 bits.</p>
<p><strong>Private</strong> ranges like <code>192.168.x.x</code> and <code>10.x.x.x</code> are used inside homes and offices. Your router translates them to one <strong>public</strong> IP on the internet.</p>`,
        questions: [
          { id: 'nw1', q: 'How many bits are in an IPv4 address?', a: ['32'], hint: '4 numbers × 8 bits.', pts: 10 },
          { id: 'nw2', q: 'Is 192.168.0.5 a public or private address?', a: ['private'], hint: '192.168.x.x is used inside home networks.', pts: 10 }
        ] },
      { title: 'Ports and services', body: `
<p>If an IP address is a building, <strong>ports</strong> are the doors. One machine can run many services, each listening on its own port number (0 to 65535).</p>
<div class="tbl-wrap"><table><tr><th>Port</th><th>Service</th><th>Used for</th></tr>
<tr><td>21</td><td>FTP</td><td>File transfer</td></tr><tr><td>22</td><td>SSH</td><td>Secure remote shell</td></tr>
<tr><td>53</td><td>DNS</td><td>Name lookups</td></tr><tr><td>80</td><td>HTTP</td><td>Websites</td></tr>
<tr><td>443</td><td>HTTPS</td><td>Encrypted websites</td></tr><tr><td>3306</td><td>MySQL</td><td>Databases</td></tr></table></div>`,
        questions: [
          { id: 'nw3', q: 'Which port does HTTPS use by default?', a: ['443'], hint: 'Check the table.', pts: 10 },
          { id: 'nw4', q: 'Which service usually runs on port 22?', a: ['ssh'], hint: 'Secure remote shell.', pts: 10 }
        ] },
      { title: 'TCP vs UDP', body: `
<p><strong>TCP</strong> is reliable. It opens a connection with a <strong>three-way handshake</strong> (SYN → SYN-ACK → ACK), numbers every packet and resends anything lost. Web pages and SSH use TCP.</p>
<p><strong>UDP</strong> just fires packets and hopes. It is faster with less overhead, so it suits video calls, games and most DNS lookups.</p>`,
        questions: [
          { id: 'nw5', q: 'Which protocol uses a three-way handshake?', a: ['tcp'], hint: 'The reliable one.', pts: 10 },
          { id: 'nw6', q: 'What is the first packet of the handshake called?', a: ['syn'], hint: 'Short for "synchronize".', pts: 15 }
        ] },
      { title: 'DNS', body: `
<p>Humans remember names like <code>example.com</code>, computers need IP addresses. <strong>DNS</strong> (Domain Name System) translates one to the other. It is the internet's phone book.</p>
<p>An <strong>A record</strong> maps a name to an IPv4 address. An <strong>MX record</strong> says which server handles a domain's email.</p>`,
        questions: [
          { id: 'nw7', q: 'Which DNS record type maps a domain name to an IPv4 address?', a: ['a', 'a record'], hint: 'A single letter.', pts: 10 },
          { id: 'nw8', q: 'Which DNS record type points to a domain\'s mail server?', a: ['mx', 'mx record'], hint: 'Mail eXchange.', pts: 10 }
        ] }
    ]
  },

  'web-101': {
    title: 'How the Web Works', diff: 'easy', mins: 20, lab: null,
    summary: 'Requests, responses, status codes and cookies. Everything web hacking builds on.',
    tasks: [
      { title: 'Requests and responses', body: `
<p>Your browser sends an <strong>HTTP request</strong>; the server replies with a <strong>response</strong>. A request has a <strong>method</strong>:</p>
<ul><li><code>GET</code> asks for a page or resource.</li><li><code>POST</code> sends data, such as a login form.</li><li><code>PUT</code> / <code>DELETE</code> update or remove resources in APIs.</li></ul>
<pre>POST /login HTTP/1.1
Host: shop.example
Content-Type: application/x-www-form-urlencoded

username=priya&amp;password=hunter2</pre>`,
        questions: [
          { id: 'wb1', q: 'Which HTTP method is normally used to submit a login form?', a: ['post'], hint: 'It sends data to the server.', pts: 10 }
        ] },
      { title: 'Status codes', body: `
<div class="tbl-wrap"><table><tr><th>Range</th><th>Meaning</th><th>Common example</th></tr>
<tr><td>2xx</td><td>Success</td><td>200 OK</td></tr><tr><td>3xx</td><td>Redirect</td><td>301 Moved Permanently</td></tr>
<tr><td>4xx</td><td>Client error</td><td>403 Forbidden, 404 Not Found</td></tr><tr><td>5xx</td><td>Server error</td><td>500 Internal Server Error</td></tr></table></div>
<p>Hackers watch status codes closely. A <code>403</code> means something exists but is protected. A <code>500</code> often means your input broke the server, which hints at a bug.</p>`,
        questions: [
          { id: 'wb2', q: 'Which status code means the page was not found?', a: ['404'], hint: 'The most famous error page.', pts: 10 },
          { id: 'wb3', q: 'Which status code means "you are not allowed to see this"?', a: ['403'], hint: 'Forbidden.', pts: 10 }
        ] },
      { title: 'Cookies and sessions', body: `
<p>HTTP forgets you between requests. After you log in, the server gives your browser a <strong>session cookie</strong>, a long random token. The browser sends it with every request so the server knows it is still you.</p>
<p class="callout">Anyone who steals your session cookie can act as you without knowing your password. That is why attacks like XSS try to read cookies, and why sites mark them <code>HttpOnly</code> so scripts cannot read them.</p>`,
        questions: [
          { id: 'wb4', q: 'Which cookie flag stops JavaScript from reading a cookie?', a: ['httponly', 'http only', 'http-only'], hint: 'Mentioned in the yellow box.', pts: 15 }
        ] }
    ]
  },

  'login-bypass': {
    title: 'Login Bypass: SQL Injection', diff: 'medium', mins: 25, lab: 'web',
    summary: 'See how a login form that pastes your input straight into a SQL query can be tricked into letting you in.',
    tasks: [
      { title: 'How the login works', body: `
<p>The practice app on the right checks logins with this SQL query. It inserts whatever you type directly into the query text:</p>
<pre>SELECT * FROM users
WHERE username = '<span>INPUT</span>' AND password = '<span>INPUT</span>'</pre>
<p>If the query returns a row, you are logged in. Try a normal login first, for example <code>priya</code> / <code>guess</code>, and watch the query box update as you type.</p>`,
        questions: [
          { id: 'sq1', q: 'Which SQL keyword in the query filters rows by a condition?', a: ['where'], hint: 'It comes right after FROM users.', pts: 10 }
        ] },
      { title: 'Breaking out of the quotes', body: `
<p>Your input sits between two single quotes. If you type a quote yourself, you close the string early, and everything after it is treated as <strong>SQL code</strong> instead of data.</p>
<p>In SQL, <code>--</code> starts a comment: everything after it is ignored. So a username of <code>admin'--</code> turns the query into:</p>
<pre>SELECT * FROM users WHERE username = 'admin'-- ' AND password = '...'</pre>
<p>The password check is now commented out. Try it in the practice app, then also try the classic <code>' OR '1'='1</code> in the password field.</p>`,
        questions: [
          { id: 'sq2', q: 'What flag do you get after logging in as admin without the password?', a: ['SC{never_trust_user_input}'], hint: "Username: admin'--   Password: anything", pts: 35, flag: true },
          { id: 'sq3', q: 'Which two characters start a SQL comment in this example?', a: ['--'], hint: 'Two of the same symbol.', pts: 10 }
        ] },
      { title: 'How developers fix it', body: `
<p>The fix is <strong>parameterized queries</strong> (also called prepared statements). The query and the data travel separately, so input can never become code:</p>
<pre># Vulnerable
query = "SELECT * FROM users WHERE username = '" + user + "'"

# Safe
cursor.execute("SELECT * FROM users WHERE username = %s", (user,))</pre>
<p>Injection has been in the OWASP Top 10 list of web risks for over 20 years. It is still found in real apps every year.</p>`,
        questions: [
          { id: 'sq4', q: 'What is the main fix for SQL injection called? (two words)', a: ['parameterized queries', 'parameterised queries', 'prepared statements', 'parameterized query', 'prepared statement'], hint: 'Query and data are sent separately.', pts: 15 }
        ] }
    ]
  },

  'log-hunt': {
    title: 'Log Hunt', diff: 'medium', mins: 25, lab: 'logs',
    summary: 'A server was broken into overnight. Read its login logs and work out who did it and how.',
    tasks: [
      { title: 'The incident', body: `
<p>You are a security analyst. The server <code>web-02</code> sent an alert at 03:14. You have a shell on it as <code>analyst</code>.</p>
<p>Linux records every SSH login attempt in <code>/var/log/auth.log</code>. Start by reading it: <code>cat /var/log/auth.log</code>.</p>`,
        questions: [
          { id: 'lg1', q: 'Which IP address keeps failing to log in?', a: ['203.0.113.45'], hint: 'Look at the "Failed password" lines.', pts: 15 }
        ] },
      { title: 'Filtering with grep', body: `
<p>Real logs have thousands of lines. <code>grep</code> shows only the lines that match a pattern:</p>
<pre>grep "Failed password" /var/log/auth.log</pre>
<p>Add <code>-c</code> to count the matches instead of printing them. You can also chain commands with a pipe <code>|</code>:</p>
<pre>grep "Failed" /var/log/auth.log | grep 203.0.113.45 | wc -l</pre>`,
        questions: [
          { id: 'lg2', q: 'How many failed login attempts came from the attacker\'s IP?', a: ['8', 'eight'], hint: 'grep -c "203.0.113.45" won\'t work alone, because the attacker also logged in successfully. Filter for Failed first.', pts: 20 },
          { id: 'lg3', q: 'Which usernames did the attacker try? Give the one they tried most.', a: ['admin'], hint: 'grep Failed /var/log/auth.log', pts: 15 }
        ] },
      { title: 'What got in?', body: `
<p>A brute-force attack only matters if it worked. Successful logins say <code>Accepted password</code>.</p>
<p>When you know which account was compromised, check its home directory for anything the attacker left behind.</p>`,
        questions: [
          { id: 'lg4', q: 'Which account did the attacker successfully log in to?', a: ['backup'], hint: 'grep Accepted /var/log/auth.log', pts: 20 },
          { id: 'lg5', q: 'The attacker left a note in that account\'s home directory. What is the flag?', a: ['SC{weak_passwords_get_guessed}'], hint: 'ls -a /home/backup', pts: 30, flag: true }
        ] }
    ]
  },

  'windows-basics': {
    title: 'Windows Basics', diff: 'easy', mins: 20, lab: null,
    summary: 'Most office computers run Windows. Learn its accounts, its command line and where it records security events.',
    tasks: [
      { title: 'Accounts and UAC', body: `
<p>Windows has <strong>standard users</strong> and <strong>administrators</strong>. Even an admin normally runs with limited rights. When a program needs more, <strong>User Account Control</strong> (UAC) shows the "Do you want to allow this app to make changes?" prompt.</p>
<p>The most powerful account is not Administrator but <code>SYSTEM</code>, which the operating system itself uses.</p>`,
        questions: [
          { id: 'wn1', q: 'What does UAC stand for?', a: ['user account control'], hint: 'Read the first paragraph.', pts: 10 },
          { id: 'wn2', q: 'Which built-in Windows account is even more powerful than Administrator?', a: ['system'], hint: 'All capitals in the text.', pts: 10 }
        ] },
      { title: 'Command Prompt and PowerShell', body: `
<p>Windows has two command lines. <strong>Command Prompt</strong> (<code>cmd</code>) is the old one; <strong>PowerShell</strong> is the modern one. Try these on your own PC:</p>
<div class="tbl-wrap"><table><tr><th>Task</th><th>Windows</th><th>Linux equivalent</th></tr>
<tr><td>Who am I?</td><td><code>whoami</code></td><td><code>whoami</code></td></tr>
<tr><td>List files</td><td><code>dir</code></td><td><code>ls</code></td></tr>
<tr><td>Read a file</td><td><code>type file.txt</code></td><td><code>cat file.txt</code></td></tr>
<tr><td>Network settings</td><td><code>ipconfig</code></td><td><code>ip a</code></td></tr>
<tr><td>Running programs</td><td><code>tasklist</code></td><td><code>ps</code></td></tr></table></div>`,
        questions: [
          { id: 'wn3', q: 'Which Windows command lists files, like ls on Linux?', a: ['dir'], hint: 'Short for directory.', pts: 10 },
          { id: 'wn4', q: 'Which Windows command lists running programs?', a: ['tasklist'], hint: 'A list of tasks.', pts: 10 }
        ] },
      { title: 'Event Viewer', body: `
<p>Windows records security events in <strong>Event Viewer</strong>, under <em>Windows Logs → Security</em>. Each kind of event has an ID number. Defenders memorise a few:</p>
<div class="tbl-wrap"><table><tr><th>Event ID</th><th>Meaning</th></tr>
<tr><td>4624</td><td>Successful logon</td></tr><tr><td>4625</td><td>Failed logon</td></tr>
<tr><td>4720</td><td>A user account was created</td></tr><tr><td>1102</td><td>The security log was cleared</td></tr></table></div>
<p>Many 4625 events followed by a 4624 looks like a password-guessing attack that worked. Event 1102 is a red flag: attackers clear logs to hide their tracks.</p>`,
        questions: [
          { id: 'wn5', q: 'Which Event ID means a failed logon?', a: ['4625'], hint: 'Check the table.', pts: 10 },
          { id: 'wn6', q: 'Which Event ID could mean an attacker is hiding their tracks?', a: ['1102'], hint: 'The log was cleared.', pts: 15 }
        ] }
    ]
  },

  'idor': {
    title: 'Broken Access Control', diff: 'easy', mins: 20, lab: 'web-idor',
    summary: 'Change one number in a URL and see someone else\'s account. The number one risk in the OWASP Top 10.',
    tasks: [
      { title: 'Authentication vs authorization', body: `
<p><strong>Authentication</strong> checks <em>who you are</em> (logging in). <strong>Authorization</strong> checks <em>what you are allowed to do</em>.</p>
<p>Broken access control means the authorization check is missing or wrong. It tops the OWASP Top 10 list of web risks.</p>`,
        questions: [
          { id: 'id1', q: 'Which one checks what you are allowed to do: authentication or authorization?', a: ['authorization', 'authorisation'], hint: 'Authentication = who you are.', pts: 10 }
        ] },
      { title: 'Change the ID', body: `
<p>You are logged in to the practice app as <strong>student</strong>. Look at the address bar: your profile is loaded with <code>?id=1005</code>.</p>
<p>The server should check that you own the profile you ask for. Does it? Change the number in the address bar and press <strong>Go</strong>. This bug is called an <strong>IDOR</strong> (Insecure Direct Object Reference).</p>`,
        questions: [
          { id: 'id2', q: 'Whose profile is at id 1002?', a: ['priya'], hint: 'Change the id to 1002.', pts: 10 },
          { id: 'id3', q: 'The admin account has a lower id than yours. What flag is on the admin profile?', a: ['SC{check_every_id}'], hint: 'Try ids below 1005, starting at 1001.', pts: 30, flag: true }
        ] },
      { title: 'The fix', body: `
<p>The fix is on the server: for every request, check that the logged-in user is allowed to see that record.</p>
<pre>profile = db.get_profile(request.id)
if profile.owner != current_user and not current_user.is_admin:
    return 403  # Forbidden</pre>
<p>Hard-to-guess IDs help a little, but they are not a fix. Only the server-side check is.</p>`,
        questions: [
          { id: 'id4', q: 'What does IDOR stand for?', a: ['insecure direct object reference'], hint: 'Read Task 2.', pts: 10 }
        ] }
    ]
  },

  'phishing-investigation': {
    title: 'Phishing Investigation', diff: 'medium', mins: 25, lab: 'phish',
    summary: 'A teacher reported a suspicious password-reset email. Read its hidden headers and prove it is fake.',
    tasks: [
      { title: 'Email headers', body: `
<p>Every email carries <strong>headers</strong>: hidden lines that record where it came from and which servers handled it. Your mail app hides them, but analysts read them first.</p>
<p>The reported email is saved as <code>reported.eml</code>. Read it: <code>cat reported.eml</code>. Use <code>grep</code> to pull out single headers, for example <code>grep Received reported.eml</code>.</p>`,
        questions: [
          { id: 'ph1', q: 'What IP address did the email really come from? (Received header)', a: ['203.0.113.99'], hint: 'grep Received reported.eml', pts: 15 },
          { id: 'ph2', q: 'Replies would go to a different address than the sender. What is the Reply-To address?', a: ['reset-team@quickmail.example'], hint: 'grep Reply-To reported.eml', pts: 15 }
        ] },
      { title: 'SPF, DKIM and DMARC', body: `
<p>Three checks prove an email really comes from the domain it claims:</p>
<ul><li><strong>SPF</strong>: is this server allowed to send mail for the domain?</li><li><strong>DKIM</strong>: does the email carry a valid digital signature from the domain?</li><li><strong>DMARC</strong>: the domain owner's policy for mail that fails those checks.</li></ul>
<p>The receiving server writes the results in the <code>Authentication-Results</code> header.</p>`,
        questions: [
          { id: 'ph3', q: 'What was the SPF result?', a: ['fail', 'spf=fail'], hint: 'grep Authentication reported.eml', pts: 15 },
          { id: 'ph4', q: 'The sender domain imitates brightside-school.com. What is the fake domain?', a: ['brightside-schoo1.com'], hint: 'Look closely at the From line. One letter is a number.', pts: 15 }
        ] },
      { title: 'Write it up', body: `
<p>Attackers often reuse tools, and some leave tracking IDs in custom headers starting with <code>X-</code>. Search for them: <code>grep X- reported.eml</code>.</p>
<p>In a real incident you would now block the sender domain and IP, search for other staff who got the same email, and reset the password of anyone who clicked.</p>`,
        questions: [
          { id: 'ph5', q: 'What flag is hidden in a custom X- header?', a: ['SC{headers_tell_the_truth}'], hint: 'grep X- reported.eml', pts: 25, flag: true }
        ] }
    ]
  },

  'careers': {
    title: 'Careers and Next Steps', diff: 'easy', mins: 15, lab: null,
    summary: 'The jobs these skills lead to, the certifications worth knowing, and legal ways to keep practising.',
    tasks: [
      { title: 'Jobs in security', body: `
<div class="tbl-wrap"><table><tr><th>Role</th><th>What they do</th></tr>
<tr><td>SOC analyst</td><td>Watches alerts in a Security Operations Centre and investigates incidents. A common first job.</td></tr>
<tr><td>Penetration tester</td><td>Hacks systems with permission and writes reports on what to fix.</td></tr>
<tr><td>Security engineer</td><td>Builds defences: firewalls, logging, secure cloud setups.</td></tr>
<tr><td>Bug bounty hunter</td><td>Finds bugs in companies' public programmes and gets paid per valid report.</td></tr></table></div>`,
        questions: [
          { id: 'cr1', q: 'What do the letters SOC stand for?', a: ['security operations centre', 'security operations center'], hint: 'Read the first row.', pts: 10 }
        ] },
      { title: 'Certifications', body: `
<p>Certifications are not required, but they help you get a first job. A common order:</p>
<ul><li><strong>CompTIA Security+</strong>: broad security knowledge. Good first certificate.</li><li><strong>eJPT</strong>: a practical beginner pentesting exam.</li><li><strong>OSCP</strong>: a hard 24-hour hands-on exam that employers respect a lot.</li></ul>`,
        questions: [
          { id: 'cr2', q: 'Which certification has a 24-hour hands-on exam?', a: ['oscp'], hint: 'The last bullet.', pts: 10 }
        ] },
      { title: 'Keep practising legally', body: `
<ul><li><strong>CTF competitions</strong> (Capture The Flag): events with puzzles just like the rooms here. Look up picoCTF for students.</li><li><strong>Practice platforms</strong> with their own legal lab machines.</li><li><strong>Bug bounty programmes</strong>: companies publish a scope and promise not to take legal action if you stay inside it.</li></ul>
<p class="callout">Found a bug outside any programme? Report it privately to the company and give them time to fix it before telling anyone. This is called <strong>responsible disclosure</strong>.</p>`,
        questions: [
          { id: 'cr3', q: 'What does CTF stand for?', a: ['capture the flag'], hint: 'You have been doing it all along.', pts: 10 },
          { id: 'cr4', q: 'Privately reporting a bug and giving the company time to fix it is called responsible ______.', a: ['disclosure'], hint: 'Read the yellow box.', pts: 10 }

  'how-computers-work': {
    title: 'How Computers Work', diff: 'easy', mins: 15, lab: null,
    summary: 'Before you can hack a computer, you need to know what is inside one and what each part does.',
    tasks: [
      { title: 'The main parts', body: `
<p>Every computer, from a phone to a server, has the same core parts:</p>
<div class="tbl-wrap"><table><tr><th>Part</th><th>What it does</th><th>Everyday comparison</th></tr>
<tr><td>CPU (processor)</td><td>Runs instructions, billions per second</td><td>The chef doing the cooking</td></tr>
<tr><td>RAM (memory)</td><td>Holds what is being worked on right now. Wiped when power is off</td><td>The kitchen counter</td></tr>
<tr><td>Storage (SSD / hard drive)</td><td>Keeps files permanently, even when off</td><td>The fridge and cupboards</td></tr>
<tr><td>Network card</td><td>Sends and receives data to other computers</td><td>The front door for deliveries</td></tr></table></div>
<p>Security matters for each one. Passwords can sit in RAM while you type them. Stolen laptops leak whatever is in storage unless it is encrypted. The network card is how most attacks arrive.</p>`,
        questions: [
          { id: 'cw1', q: 'Which part runs the instructions of a program?', a: ['cpu', 'processor', 'the cpu'], hint: 'Three letters. Central Processing Unit.', pts: 5 },
          { id: 'cw2', q: 'Which part is wiped when the power turns off: RAM or storage?', a: ['ram', 'memory'], hint: 'The kitchen counter, not the fridge.', pts: 5 }
        ] },
      { title: 'The operating system', body: `
<p>The <strong>operating system</strong> (OS) is the main program that manages the hardware and runs every other program. Common ones are <strong>Windows</strong>, <strong>macOS</strong>, <strong>Linux</strong>, <strong>Android</strong> and <strong>iOS</strong>.</p>
<p>The core of an OS is the <strong>kernel</strong>. It decides which program gets the CPU, which memory, and which files it may touch.</p>
<p>Most of the internet's servers run <strong>Linux</strong>, and so do most hacking tools. That is why you will learn the Linux command line soon.</p>`,
        questions: [
          { id: 'cw3', q: 'What is the core part of an operating system called?', a: ['kernel', 'the kernel'], hint: 'Like the core of a seed or nut.', pts: 5 },
          { id: 'cw4', q: 'Which operating system runs most web servers?', a: ['linux'], hint: 'The penguin.', pts: 5 }
        ] },
      { title: 'Programs and processes', body: `
<p>A <strong>program</strong> is a file of instructions sitting in storage. When you open it, the OS loads it into RAM and it becomes a running <strong>process</strong>.</p>
<p>Every process runs as some <strong>user</strong>, and it can only do what that user is allowed to do. A big goal in hacking is <strong>privilege escalation</strong>: going from a normal user to the all-powerful admin account (called <code>root</code> on Linux and <code>Administrator</code> or <code>SYSTEM</code> on Windows).</p>`,
        questions: [
          { id: 'cw5', q: 'What is a running program called?', a: ['process', 'a process'], hint: 'Starts with P.', pts: 5 },
          { id: 'cw6', q: 'What is the name of the all-powerful admin user on Linux?', a: ['root'], hint: 'Like the root of a tree.', pts: 5 }
        ] }
    ]
  },

  'binary-hex': {
    title: 'Binary and Hex', diff: 'easy', mins: 20, lab: null,
    summary: 'Computers count in 1s and 0s. Learn to read binary and hexadecimal, which you will see everywhere in hacking.',
    tasks: [
      { title: 'Bits and bytes', body: `
<p>A computer stores everything as electrical on/off signals, written as <code>1</code> and <code>0</code>. One of these is a <strong>bit</strong>. Eight bits make a <strong>byte</strong>.</p>
<ul><li>1 byte can hold one letter, like <code>A</code>.</li><li>1 kilobyte (KB) is about 1,000 bytes. 1 megabyte (MB) is about a million.</li></ul>`,
        questions: [
          { id: 'bh1', q: 'How many bits are in one byte?', a: ['8', 'eight'], hint: 'Same as legs on a spider.', pts: 5 }
        ] },
      { title: 'Counting in binary', body: `
<p>In normal (decimal) numbers each place is worth 10× the one to its right: 1, 10, 100. In binary each place is worth <strong>2×</strong>:</p>
<div class="tbl-wrap"><table><tr><th>128</th><th>64</th><th>32</th><th>16</th><th>8</th><th>4</th><th>2</th><th>1</th></tr>
<tr><td>0</td><td>0</td><td>0</td><td>0</td><td>1</td><td>0</td><td>1</td><td>0</td></tr></table></div>
<p>To read it, add up the places that have a 1. Above: 8 + 2 = <strong>10</strong>. So <code>00001010</code> in binary is 10 in decimal.</p>
<p>All eight bits set to 1 (<code>11111111</code>) gives 128+64+32+16+8+4+2+1 = <strong>255</strong>. That is why each number in an IP address stops at 255.</p>`,
        questions: [
          { id: 'bh2', q: 'What is binary 0101 in decimal?', a: ['5', 'five'], hint: 'Places are 8, 4, 2, 1. Add the ones with a 1.', pts: 10 },
          { id: 'bh3', q: 'What is binary 1100 in decimal?', a: ['12', 'twelve'], hint: '8 + 4.', pts: 10 },
          { id: 'bh4', q: 'Write the number 7 in 4-bit binary.', a: ['0111', '111'], hint: '4 + 2 + 1.', pts: 10 }
        ] },
      { title: 'Hexadecimal', body: `
<p>Binary gets long fast, so people use <strong>hexadecimal</strong> (hex, base 16). It uses 0–9 and then A–F for 10–15:</p>
<pre>A = 10   B = 11   C = 12   D = 13   E = 14   F = 15</pre>
<p>One hex digit equals exactly 4 bits, so one byte is always two hex digits: <code>FF</code> = 255, <code>0A</code> = 10. Hex is often written with <code>0x</code> in front, like <code>0x41</code>.</p>
<p>You will see hex in password hashes, memory addresses, MAC addresses and website colours like <code>#FF0000</code> (pure red).</p>`,
        questions: [
          { id: 'bh5', q: 'What decimal number is the hex digit C?', a: ['12', 'twelve'], hint: 'A=10, B=11...', pts: 10 },
          { id: 'bh6', q: 'What is hex FF in decimal?', a: ['255'], hint: 'The largest number one byte can hold.', pts: 10 }
        ] }
    ]
  },

  'stay-safe-online': {
    title: 'Protect Yourself First', diff: 'easy', mins: 20, lab: null,
    summary: 'Strong passwords, two-factor authentication and spotting phishing. Secure your own accounts before you test anyone else\'s.',
    tasks: [
      { title: 'Strong passwords', body: `
<p>Attackers do not guess passwords one by one. They use lists of millions of leaked passwords and try them all in seconds. So the best passwords are:</p>
<ul><li><strong>Long</strong>: length beats complexity. <code>correct-horse-battery-staple</code> is far stronger than <code>P@ss1</code>.</li><li><strong>Unique</strong>: never reused. When one site leaks, attackers try that password everywhere else. This is called <strong>credential stuffing</strong>.</li><li><strong>Stored in a password manager</strong>, so you only remember one strong master password.</li></ul>`,
        questions: [
          { id: 'ss1', q: 'Trying leaked passwords from one site on many other sites is called credential ______.', a: ['stuffing'], hint: 'Like stuffing a turkey.', pts: 10 },
          { id: 'ss2', q: 'Which matters more for password strength: length or using symbols?', a: ['length'], hint: 'Read the first bullet.', pts: 5 }
        ] },
      { title: 'Two-factor authentication', body: `
<p><strong>Two-factor authentication</strong> (2FA, or MFA) asks for something extra after your password. The three kinds of factor are:</p>
<ul><li>Something you <strong>know</strong>: a password or PIN.</li><li>Something you <strong>have</strong>: your phone, an authenticator app, a security key.</li><li>Something you <strong>are</strong>: fingerprint or face.</li></ul>
<p>With 2FA on, a stolen password alone is not enough. Turn it on for your email first, because email resets every other account.</p>`,
        questions: [
          { id: 'ss3', q: 'A fingerprint is "something you ___".', a: ['are'], hint: 'Know, have, or...', pts: 5 },
          { id: 'ss4', q: 'Which account should you protect with 2FA first?', a: ['email', 'e-mail', 'your email'], hint: 'It can reset all the others.', pts: 10 }
        ] },
      { title: 'Spotting phishing', body: `
<p><strong>Phishing</strong> is a fake message that tricks you into clicking a link, typing a password or opening a file. It is the most common way real attacks begin. Read this example:</p>
<pre>From:    PayPal Security &lt;alerts@paypa1-support.com&gt;
Subject: URGENT: Your account will be closed in 24 hours

We noticed unusual activity. Verify your identity now
or your account will be permanently suspended:
https://paypa1-support.com/verify</pre>
<p>Warning signs: the sender's domain uses the number <strong>1</strong> instead of the letter <strong>l</strong>; it creates panic with a deadline; and the link goes to a domain that is not the real company. When in doubt, never click. Type the real website address yourself.</p>`,
        questions: [
          { id: 'ss5', q: 'What is the fake domain in the example email?', a: ['paypa1-support.com'], hint: 'Look after the @ sign.', pts: 10 },
          { id: 'ss6', q: 'Phishing that creates panic with a deadline uses a sense of ______.', a: ['urgency'], hint: 'The subject line says URGENT.', pts: 10 }
        ] }
    ]
  },

  'linux-permissions': {
    title: 'Linux Permissions', diff: 'easy', mins: 25, lab: 'perms',
    summary: 'Who can read, write and run each file. Misconfigured permissions are one of the most common ways attackers gain power.',
    tasks: [
      { title: 'Reading ls -l', body: `
<p><code>ls -l</code> shows permissions for every file:</p>
<pre>-rwxr-x--- 1 root  staff  220 Nov 20 report.sh
│└┬┘└┬┘└┬┘   owner group
│ │  │  └── others
│ │  └───── group
│ └──────── owner
└────────── - = file, d = directory</pre>
<p><code>r</code> = read, <code>w</code> = write, <code>x</code> = execute (run). A <code>-</code> means that permission is missing. Run <code>ls -l</code> in the lab.</p>`,
        questions: [
          { id: 'lp1', q: 'Which user owns secret.txt?', a: ['root'], hint: 'ls -l, third column.', pts: 10 },
          { id: 'lp2', q: 'What letter means "execute" in a permission string?', a: ['x'], hint: 'r, w and...', pts: 5 }
        ] },
      { title: 'Permission denied', body: `
<p>Try <code>cat secret.txt</code>. You are <code>student</code>, the file belongs to <code>root</code>, and "others" have no read permission, so the OS refuses.</p>
<p>This is good security. If a file with passwords were readable by everyone, any user could steal them. Attackers always look for files that are readable or writable when they should not be.</p>`,
        questions: [
          { id: 'lp3', q: 'What error do you get when reading secret.txt?', a: ['permission denied'], hint: 'Two words.', pts: 10 },
          { id: 'lp4', q: 'One config file in your home directory is readable by everyone but contains a password. What is the password?', a: ['Tutor2026!'], hint: 'Look for a .conf file and cat it.', pts: 20 }
        ] },
      { title: 'Making a script run', body: `
<p>To run a program in the current folder you type <code>./name</code>. Try <code>./hello.sh</code>. It fails because the file has no <code>x</code> permission.</p>
<p>The owner of a file can change its permissions with <code>chmod</code>. Give it execute permission, then run it:</p>
<pre>chmod +x hello.sh
./hello.sh</pre>
<p>Permissions are also written as numbers: r=4, w=2, x=1, added up for owner, group and others. <code>rwxr-xr-x</code> is 7,5,5, written <strong>755</strong>.</p>`,
        questions: [
          { id: 'lp5', q: 'What flag does hello.sh print once it can run?', a: ['SC{chmod_plus_x}'], hint: 'chmod +x hello.sh then ./hello.sh', pts: 25, flag: true },
          { id: 'lp6', q: 'What is rw-r--r-- as a number?', a: ['644'], hint: 'rw- = 4+2, r-- = 4.', pts: 15 }
        ] }
    ]
  },

  /* ---------- CRYPTO ---------- */
  'encoding-vs-encryption': {
    title: 'Encoding vs Encryption', diff: 'easy', mins: 20, lab: 'crypto',
    summary: 'Base64 is not a secret. Learn which transformations actually protect data and which only change its shape.',
    tasks: [
      { title: 'Three different things', body: `
<div class="tbl-wrap"><table><tr><th>Type</th><th>Purpose</th><th>Reversible?</th><th>Example</th></tr>
<tr><td>Encoding</td><td>Change the format so data travels safely</td><td>Yes, by anyone</td><td>Base64</td></tr>
<tr><td>Encryption</td><td>Keep data secret</td><td>Only with the key</td><td>AES</td></tr>
